name: Hantera platsförslag

# När du kommenterar "godkänn" eller "neka" i ett gransknings-ärende
# uppdateras posten i Supabase. Godkända platser/kommentarer visas direkt
# för alla (appen läser godkänt live – ingen omdeploy behövs).
# Kräver secret SUPABASE_ACCESS_TOKEN.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  hantera:
    # Bara gransknings-ärenden och kommentarer från repo-ägare/medarbetare
    if: >
      (contains(github.event.issue.labels.*.name, 'platsförslag') ||
       contains(github.event.issue.labels.*.name, 'omdöme')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            // Redan avgjorda ärenden ändras inte (skydd mot senare "neka" på
            // en publicerad plats).
            if (context.payload.issue.state === 'closed') {
              core.info('Ärendet är redan stängt/avgjort – ignorerar.')
              return
            }
            // Första ordet avgör (utan skiljetecken). OBS: \b fungerar inte
            // med å/ä/ö i JS-regex, därför ord-jämförelse i stället.
            const word = (context.payload.comment.body || '')
              .trim()
              .toLowerCase()
              .split(/\s+/)[0]
              .replace(/[!.,:;)]+$/, '')
            let status = null
            if (['godkänn', 'godkänd', 'godkänns', 'approve'].includes(word)) status = 'approved'
            else if (['neka', 'nekad', 'nekas', 'avslå', 'avslås', 'reject'].includes(word))
              status = 'rejected'
            if (!status) {
              core.info('Kommentaren är varken godkänn eller neka – ignorerar.')
              return
            }
            // Markören står alltid på ärendets FÖRSTA rad (skydd mot att
            // användartext i beskrivningen innehåller en förfalskad markör).
            const body = context.payload.issue.body || ''
            const m = body.match(/^<!-- (submission|review):([0-9a-f-]{36}) -->/i)
            if (!m) {
              core.setFailed('Hittade inget giltigt förslags-id i ärendet.')
              return
            }
            const table = m[1] === 'review' ? 'reviews' : 'submissions'
            const id = m[2]
            const token = process.env.SUPABASE_ACCESS_TOKEN
            let urlVar = process.env.SUPABASE_URL
            if (!urlVar && fs.existsSync('supabase.env')) {
              const m = fs.readFileSync('supabase.env', 'utf8').match(/VITE_SUPABASE_URL=(.+)/)
              if (m) urlVar = m[1].trim()
            }
            if (!token || !urlVar) {
              core.setFailed('SUPABASE_ACCESS_TOKEN eller Supabase-koppling saknas. Se docs/ADMIN.md.')
              return
            }
            const ref = new URL(urlVar).hostname.split('.')[0]
            const mgmtHeaders = { Authorization: `Bearer ${token}` }
            // Väck databasen om den är pausad (gratisprojekt somnar av sig
            // själva) så att godkännandet inte tappas bort.
            let proj = await (await fetch(`https://api.supabase.com/v1/projects/${ref}`, { headers: mgmtHeaders })).json()
            if (String(proj.status).startsWith('INACTIVE')) {
              core.info('Databasen är pausad – väcker den …')
              await fetch(`https://api.supabase.com/v1/projects/${ref}/restore`, { method: 'POST', headers: mgmtHeaders })
            }
            for (let i = 0; i < 40 && !String(proj.status).includes('ACTIVE_HEALTHY'); i++) {
              await new Promise((r) => setTimeout(r, 15_000))
              proj = await (await fetch(`https://api.supabase.com/v1/projects/${ref}`, { headers: mgmtHeaders })).json()
              if (i % 4 === 0) core.info(`  … väntar på databasen: ${proj.status}`)
            }
            if (!String(proj.status).includes('ACTIVE_HEALTHY')) {
              core.setFailed(`Databasen vaknade inte i tid (${proj.status}). Kommentera "${word}" igen om en stund.`)
              return
            }
            const res = await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                query: `update ${table} set status = '${status}' where id = '${id}'`,
              }),
            })
            if (!res.ok) {
              core.setFailed(`Supabase svarade ${res.status}: ${await res.text()}`)
              return
            }
            const vad = table === 'reviews' ? 'kommentaren' : 'platsen'
            const svar =
              status === 'approved'
                ? `✅ Godkänd – ${vad} visas nu för alla i appen.`
                : `❌ Nekad – ${vad} publiceras inte.`
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: svar,
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
            })
