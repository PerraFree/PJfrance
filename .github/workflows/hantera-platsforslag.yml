name: Hantera platsförslag

# När du kommenterar "godkänn" eller "neka" i ett gransknings-ärende
# uppdateras posten i Supabase. Godkända platser/kommentarer visas direkt
# för alla (appen läser godkänt live – ingen omdeploy behövs).
#
# Kräver secret SUPABASE_SERVICE_KEY = projektets hemliga API-nyckel (se
# bevaka-platsforslag.yml). Går inte ut, kan bara läsa/skriva i databasen –
# inte ändra projektet (säkerhetsfynd 2, GHSA-72p3-7774-p8h3). Jobbet
# startas av en issue-kommentar och behöver bara ändra `status` i en rad.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  hantera:
    # Bara gransknings-ärenden som bevakningen själv skapat (github-actions[bot] –
    # repot är publikt och en etikett kan följa med en ärendemall; granskning
    # 28 okt 2026) och kommentarer från repo-ägare/medarbetare
    if: >
      github.event.issue.user.login == 'github-actions[bot]' &&
      (contains(github.event.issue.labels.*.name, 'platsförslag') ||
       contains(github.event.issue.labels.*.name, 'omdöme')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        with:
          script: |
            const fs = require('fs')
            // Ett misslyckat försök syns som kommentar i ärendet (förut bara en
            // röd körning som ingen såg – granskning 28 okt 2026).
            const fail = async (msg) => {
              core.setFailed(msg)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⚠️ Det gick inte att spara beslutet: ${msg}`,
              })
            }
            // Redan avgjorda ärenden ändras inte (skydd mot senare "neka" på
            // en publicerad plats).
            if (context.payload.issue.state === 'closed') {
              core.info('Ärendet är redan stängt/avgjort – ignorerar.')
              return
            }
            // Första ordet avgör (utan skiljetecken). OBS: \b fungerar inte
            // med å/ä/ö i JS-regex, därför ord-jämförelse i stället.
            const word = (context.payload.comment.body || '')
              .trim()
              .toLowerCase()
              .split(/\s+/)[0]
              .replace(/[!.,:;)]+$/, '')
            let status = null
            if (['godkänn', 'godkänd', 'godkänns', 'approve'].includes(word)) status = 'approved'
            else if (['neka', 'nekad', 'nekas', 'avslå', 'avslås', 'reject'].includes(word))
              status = 'rejected'
            if (!status) {
              core.info('Kommentaren är varken godkänn eller neka – ignorerar.')
              return
            }
            // Markören står alltid på ärendets FÖRSTA rad (skydd mot att
            // användartext i beskrivningen innehåller en förfalskad markör).
            const body = context.payload.issue.body || ''
            const m = body.match(/^<!-- (submission|review):([0-9a-f-]{36}) -->/i)
            if (!m) {
              await fail('Hittade inget giltigt förslags-id i ärendet.')
              return
            }
            const table = m[1] === 'review' ? 'reviews' : 'submissions'
            const id = m[2]
            const key = process.env.SUPABASE_SERVICE_KEY
            let urlVar = process.env.SUPABASE_URL
            if (!urlVar && fs.existsSync('supabase.env')) {
              const m = fs.readFileSync('supabase.env', 'utf8').match(/VITE_SUPABASE_URL=(.+)/)
              if (m) urlVar = m[1].trim()
            }
            if (!key || !urlVar) {
              await fail('Secret SUPABASE_SERVICE_KEY eller Supabase-koppling saknas. Se docs/ADMIN.md.')
              return
            }
            const base = urlVar.replace(/\/$/, '')
            const headers = {
              apikey: key,
              'Content-Type': 'application/json',
              Prefer: 'return=representation',
            }
            if (key.startsWith('eyJ')) headers.Authorization = `Bearer ${key}`
            // Bara status-kolumnen, bara raden med exakt detta id (uuid-format
            // kontrollerat av regexen ovan).
            const res = await fetch(`${base}/rest/v1/${table}?id=eq.${id}`, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({ status }),
            })
            if (!res.ok) {
              await fail(
                `Supabase svarade ${res.status}: ${(await res.text()).slice(0, 300)}. ` +
                  'Kontrollera SUPABASE_SERVICE_KEY, och att projektet inte är pausat. Kommentera igen om en stund.',
              )
              return
            }
            const rows = await res.json()
            if (!Array.isArray(rows) || rows.length !== 1) {
              await fail(`Hittade ingen rad med id ${id} i ${table} – är den redan borttagen i Supabase?`)
              return
            }
            const vad = table === 'reviews' ? 'kommentaren' : 'platsen'
            const svar =
              status === 'approved'
                ? `✅ Godkänd – ${vad} visas nu för alla i appen.`
                : `❌ Nekad – ${vad} publiceras inte.`
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: svar,
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
            })
