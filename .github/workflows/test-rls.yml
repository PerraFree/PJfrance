name: Test RLS (tillfällig)

# Tillfälligt testjobb för säkerhetsfynd 2 (GHSA-72p3-7774-p8h3): skapar ett
# väntande testförslag (läge "skapa") så att bevakning → ärende → "godkänn"
# kan testas hela vägen, och städar bort det efteråt (läge "stada"). Tas bort
# efter verifiering.

on:
  workflow_dispatch:
    inputs:
      lage:
        description: 'skapa eller stada'
        type: choice
        options: [skapa, stada]
        default: skapa

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Skapa/städa testförslag
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LAGE: ${{ inputs.lage }}
        run: |
          set -u
          URL=$(grep VITE_SUPABASE_URL supabase.env | cut -d= -f2)
          KEY=$(grep VITE_SUPABASE_ANON_KEY supabase.env | cut -d= -f2)
          REF=$(echo "$URL" | sed -E 's#https://([^.]+)\..*#\1#')
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal")
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
                 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
                 -d "{\"query\": $(printf '%s' "$1" | jq -Rs .)}"; }
          if [ "$LAGE" = "skapa" ]; then
            c=$(curl -s -o /tmp/body -w "%{http_code}" "${H[@]}" -X POST "$URL/rest/v1/submissions" \
                 -d '{"name":"RLS-test godkänn @perrafree #1","address":"RLS-test","services":["vatten"],"lat":57.72,"lon":12.94,"status":"pending"}')
            echo "Testförslag skapat → HTTP $c"
          else
            echo "Status före städning: $(q "select name, status from submissions where address = 'RLS-test'")"
            q "delete from submissions where address = 'RLS-test'" > /dev/null
            q "delete from rate_limits where bucket = 'submissions'" > /dev/null
            echo "Kvar efter städning: $(q "select count(*) as n from submissions where address = 'RLS-test'")"
          fi
