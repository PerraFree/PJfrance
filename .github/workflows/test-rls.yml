name: Test RLS (tillfällig)

# Tillfälligt testjobb för säkerhetsfynd 2/4 (GHSA-72p3-7774-p8h3). Tas bort
# efter verifiering. Körs från en runner eftersom Supabase är blockerat från
# Claude-sandboxen.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testa hemlig nyckel + sondera headers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -u
          URL=$(grep VITE_SUPABASE_URL supabase.env | cut -d= -f2)
          KEY=$(grep VITE_SUPABASE_ANON_KEY supabase.env | cut -d= -f2)
          REF=$(echo "$URL" | sed -E 's#https://([^.]+)\..*#\1#')
          H=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal")
          q() { curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
                 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
                 -d "{\"query\": $(printf '%s' "$1" | jq -Rs .)}"; }
          fail=0

          # --- Fynd 2: hemlig nyckel via PostgREST ---
          if [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "SERVICE_KEY: saknas – secret SUPABASE_SERVICE_KEY är inte skapad ännu"
            fail=1
          else
            SH=(-H "apikey: $SUPABASE_SERVICE_KEY" -H "Content-Type: application/json")
            case "$SUPABASE_SERVICE_KEY" in eyJ*) SH+=(-H "Authorization: Bearer $SUPABASE_SERVICE_KEY");; esac
            echo "SERVICE_KEY: format $(echo "$SUPABASE_SERVICE_KEY" | cut -c1-10)…"
            c=$(curl -s -o /tmp/body -w "%{http_code}" "${H[@]}" -X POST "$URL/rest/v1/submissions" \
                 -d '{"name":"RLS-test nyckel","address":"RLS-test","services":["vatten"],"lat":57.7,"lon":12.9,"status":"pending"}')
            echo "Testförslag (anon) → HTTP $c"
            c=$(curl -s -o /tmp/body -w "%{http_code}" "${SH[@]}" "$URL/rest/v1/submissions?status=eq.pending&address=eq.RLS-test&select=id")
            echo "Läs väntande med hemlig nyckel → HTTP $c ($(head -c 200 /tmp/body))"
            case "$c" in 200) echo "  OK";; *) echo "  FEL"; fail=1;; esac
            ID=$(jq -r '.[0].id // empty' /tmp/body)
            if [ -n "$ID" ]; then
              c=$(curl -s -o /tmp/body -w "%{http_code}" "${SH[@]}" -H "Prefer: return=representation" -X PATCH \
                   "$URL/rest/v1/submissions?id=eq.$ID" -d '{"status":"rejected"}')
              echo "PATCH status med hemlig nyckel → HTTP $c (rader: $(jq 'length' /tmp/body 2>/dev/null))"
              case "$c" in 200) echo "  OK";; *) echo "  FEL"; fail=1;; esac
            fi
            c=$(curl -s -o /tmp/body -w "%{http_code}" "${H[@]}" -X PATCH "$URL/rest/v1/submissions?address=eq.RLS-test" -d '{"status":"approved"}')
            echo "PATCH med anon-nyckeln → HTTP $c (ska nekas eller 0 rader)"
            c=$(curl -s -o /tmp/body -w "%{http_code}" "${SH[@]}" "https://api.supabase.com/v1/projects/$REF")
            echo "Hemlig nyckel mot Management API → HTTP $c (ska nekas)"
          fi

          # --- Fynd 4: spamskydd – 6 snabba förslag från samma IP, det 6:e ska nekas ---
          q "delete from rate_limits where bucket = 'submissions'" > /dev/null
          codes=""
          for i in 1 2 3 4 5 6; do
            c=$(curl -s -o /tmp/body -w "%{http_code}" "${H[@]}" -X POST "$URL/rest/v1/submissions" \
                 -d "{\"name\":\"RLS-test spam $i\",\"address\":\"RLS-test\",\"services\":[\"vatten\"],\"lat\":57.7,\"lon\":12.9,\"status\":\"pending\"}")
            codes="$codes $c"
          done
          echo "6 förslag i rad → HTTP$codes"
          echo "  sista svaret: $(head -c 300 /tmp/body)"
          case "$codes" in " 201 201 201 201 201 400") echo "  OK: 5 släpps igenom, 6:e nekas";; *) echo "  FEL: oväntade svar"; fail=1;; esac
          echo "Rader i rate_limits: $(q "select bucket, count(*) as n from rate_limits group by bucket")"
          q "delete from rate_limits where bucket = 'submissions'" > /dev/null

          q "delete from submissions where address = 'RLS-test'" > /dev/null
          echo "Kvar efter städning: $(q "select count(*) as n from submissions where address = 'RLS-test'")"
          exit $fail
