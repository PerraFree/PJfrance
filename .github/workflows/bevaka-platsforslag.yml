name: Bevaka platsförslag

# Kollar efter nya platsförslag och kommentarer i Supabase och öppnar ett
# GitHub-ärende per post. GitHub mejlar dig automatiskt. Godkänn genom att
# kommentera "godkänn" i ärendet.
#
# Kräver secret SUPABASE_SERVICE_KEY = projektets HEMLIGA API-nyckel
# (Supabase → Project Settings → API Keys → "Secret keys" → sb_secret_…,
# eller den äldre "service_role"-nyckeln). Den går inte ut och kan bara
# läsa/skriva i databasen, inte ändra projektet (säkerhetsfynd 2,
# GHSA-72p3-7774-p8h3). Kontotoken SUPABASE_ACCESS_TOKEN används numera
# BARA av "Installera databasen" (manuell) – det är också den som kör
# supabase/schema.sql; ändrar du schemat, kör den workflowen en gång.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  issues: write
  contents: read

concurrency:
  group: platsforslag
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        with:
          script: |
            const fs = require('fs')
            const key = process.env.SUPABASE_SERVICE_KEY
            let urlVar = process.env.SUPABASE_URL
            if (!urlVar && fs.existsSync('supabase.env')) {
              const m = fs.readFileSync('supabase.env', 'utf8').match(/VITE_SUPABASE_URL=(.+)/)
              if (m) urlVar = m[1].trim()
            }
            if (!key || !urlVar) {
              core.setFailed(
                'Secret SUPABASE_SERVICE_KEY saknas (eller Supabase-kopplingen). Hämta projektets hemliga ' +
                  'API-nyckel i Supabase (Project Settings → API Keys) och lägg in den som repo-secret ' +
                  'SUPABASE_SERVICE_KEY. Se docs/ADMIN.md.',
              )
              return
            }
            // PostgREST med den hemliga nyckeln (kringgår RLS). Nya sb_secret_-
            // nycklar skickas bara i apikey-headern; äldre service_role-nycklar
            // (JWT, börjar på "eyJ") även som Bearer.
            const base = urlVar.replace(/\/$/, '')
            const headers = { apikey: key, 'Content-Type': 'application/json' }
            if (key.startsWith('eyJ')) headers.Authorization = `Bearer ${key}`
            const q = async (path) => {
              const res = await fetch(`${base}/rest/v1/${path}`, { headers })
              if (!res.ok) {
                throw new Error(
                  `Supabase svarade ${res.status} för ${path.split('?')[0]}: ${(await res.text()).slice(0, 300)}. ` +
                    'Kontrollera SUPABASE_SERVICE_KEY, och att projektet inte är pausat (supabase.com/dashboard).',
                )
              }
              return res.json()
            }

            // Databasvakt (granskning 12 okt 2026): svarar inte Supabase (pausat
            // projekt ger 540/5xx, utgången nyckel 401) öppnas ETT ärende så att
            // Per får mejl – och stängs automatiskt när databasen svarar igen.
            const dbMarker = '<!-- supabase-vakt -->'
            const openIssues = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 })
            const dbIssue = openIssues.find((i) => i.user?.login === 'github-actions[bot]' && (i.body ?? '').startsWith(dbMarker))
            let dbError = null
            for (let i = 0; i < 2; i++) {
              try {
                await q('submissions?select=id&limit=1')
                dbError = null
                break
              } catch (e) {
                dbError = e
                await new Promise((r) => setTimeout(r, 15000))
              }
            }
            if (dbError) {
              const body = `${dbMarker}\nDatabasen (Supabase) svarade inte ${new Date().toISOString().slice(0, 16)} UTC:\n\n\`${String(dbError.message).replace(/`/g, '').slice(0, 400)}\`\n\n` +
                `_Vanligaste orsaken: projektet har pausats. Öppna supabase.com/dashboard → projektet Greywater → **Restore**, eller kör workflowen "Installera databasen". Ärendet stängs automatiskt när databasen svarar igen._`
              if (dbIssue) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: dbIssue.number, body })
              else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Databasen (Supabase) svarar inte – förslag, betyg och foton fungerar inte', body, labels: ['backlog', 'prio-1'] })
              // Felmejl bara första gången – därefter varning (ärendet finns redan),
              // som sajtvakten. Annars kom ett felmejl var 3:e timme (granskning 14 okt 2026).
              if (dbIssue) core.warning(dbError.message)
              else core.setFailed(dbError.message)
              return
            }
            if (dbIssue) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: dbIssue.number, body: 'Databasen svarar normalt igen.' })
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: dbIssue.number, state: 'closed', state_reason: 'completed' })
            }

            // Befintliga gransknings-ärenden (dedup)
            const labels = ['platsförslag', 'omdöme']
            const existing = []
            for (const label of labels) {
              const found = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: label,
                state: 'all',
                per_page: 100,
              })
              existing.push(...found)
            }
            // Markören ligger alltid FÖRST i ärendet – matcha bara där, så att
            // användartext aldrig kan förfalska/blockera en markör.
            const seen = (marker) => existing.some((i) => (i.body || '').startsWith(marker))
            // Sanera användartext (säkerhetsfynd 4, GHSA-72p3-7774-p8h3):
            // ta bort HTML-kommentarer, neutralisera @ och # så att ett
            // förslag inte kan notifiera godtyckliga GitHub-användare eller
            // länka ärenden via Pers repo, och gör texten säker i
            // markdown-tabellceller (| och radbrytningar).
            // OBS ordningen: # först, annars träffas #-tecknet i "&#64;".
            // Säkerhetsgranskning 12 okt 2026: även markdown-länkar/bilder och
            // klickbara adresser neutraliseras (annars kunde ett förslag med
            // [Logga in här](https://ond.se) hamna som länk i Pers mejl).
            const neutral = (s) =>
              String(s)
                .replace(/<!--|-->/g, '')
                .replace(/#/g, '&#35;')
                .replace(/@/g, '&#64;')
                .replace(/[[\]()!<>`*_~]/g, (c) => '&#' + c.charCodeAt(0) + ';')
                .replace(/(https?):\/\//gi, '$1&#58;//')
                // www.… blir också länk i GitHub; osynliga styrtecken (RTL,
                // nollbredd) kan vända eller dölja text (granskning 12 okt 2026).
                .replace(/\bwww\./gi, 'www&#46;')
                .replace(/\p{Cf}/gu, '')
            const cell = (v) =>
              neutral(v ?? '–')
                .replace(/\|/g, '\\|')
                .replace(/\r\n|\r|\n/g, '<br>') || '–'
            // Titlar är ren text (HTML-entiteter visas som de är, @ ger ingen
            // notis där) – ta bara bort HTML-kommentarer och radbrytningar.
            const titel = (v) => String(v ?? '–').replace(/<!--|-->/g, '').replace(/\p{Cf}/gu, '').replace(/\s+/g, ' ').trim() || '–'
            // GitHub vägrar titlar >256 tecken och brödtext >65 536 tecken
            // (säkerhetsfynd 3) – korta hellre än att låta ärendet fallera.
            const kortTitel = (s) => (s.length > 200 ? s.slice(0, 197) + '…' : s)
            const kortBody = (s) => (s.length > 60_000 ? s.slice(0, 59_900) + '\n\n… (texten är avkortad)' : s)
            const skapa = (title, body, label) =>
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: kortTitel(title),
                body: kortBody(body),
                labels: [label],
              })
            const fotter = [
              ``,
              `---`,
              `**Svara med en kommentar:**`,
              `- Skriv \`godkänn\` för att publicera`,
              `- Skriv \`neka\` för att avslå`,
            ]
            // Tak per körning (säkerhetsfynd 4): en spam-loop mot det öppna
            // REST-API:t ska inte kunna skapa tusentals ärenden/mejl. Resten
            // tas nästa körning (var 3:e timme), och en varning syns i loggen.
            const MAX_PER_RUN = 20
            let created = 0
            let failed = 0
            let vantar = 0
            // En rad som inte går att göra ärende av (säkerhetsfynd 3) får
            // inte stoppa övriga – logga och fortsätt.
            const forsok = async (vad, fn) => {
              if (created >= MAX_PER_RUN) {
                vantar++
                return
              }
              try {
                await fn()
                created++
              } catch (e) {
                failed++
                core.warning(`Kunde inte skapa ärende för ${vad}: ${e.message}`)
              }
            }

            // 1) Platsförslag
            const subs = await q(
              'submissions?status=eq.pending&select=id,name,address,services,fee,description,lat,lon&order=created_at.asc&limit=500',
            )
            for (const r of subs) {
              const marker = `<!-- submission:${r.id} -->`
              if (seen(marker)) continue
              const services = Array.isArray(r.services) ? r.services.join(', ') : String(r.services ?? '')
              const body = [
                marker,
                `**Nytt platsförslag väntar på granskning**`,
                ``,
                `| | |`,
                `|---|---|`,
                `| **Namn** | ${cell(r.name)} |`,
                `| **Adress** | ${cell(r.address)} |`,
                `| **Tjänster** | ${cell(services)} |`,
                `| **Avgift** | ${cell(r.fee)} |`,
                `| **Kommentar** | ${cell(r.description)} |`,
                `| **Koordinater** | ${r.lat}, ${r.lon} |`,
                ``,
                `[📍 Google Maps](https://www.google.com/maps?q=${Number(r.lat)},${Number(r.lon)}) · [🗺 Tömningskartan](https://tomningskartan.se/?at=${Number(r.lat)},${Number(r.lon)},15)`,
                ...fotter,
              ].join('\n')
              await forsok(`förslag ${r.id}`, () => skapa(`Nytt platsförslag: ${titel(r.name)}`, body, 'platsförslag'))
            }

            // 2) Kommentarer/omdömen med text
            const revs = await q(
              'reviews?status=eq.pending&select=id,station_id,station_name,rating,comment&order=created_at.asc&limit=500',
            )
            for (const r of revs) {
              const marker = `<!-- review:${r.id} -->`
              if (seen(marker)) continue
              const body = [
                marker,
                `**Ny kommentar väntar på granskning**`,
                ``,
                `| | |`,
                `|---|---|`,
                `| **Plats** | ${cell(r.station_name ?? r.station_id)} |`,
                `| **Betyg** | ${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)} (${r.rating}/5) |`,
                ``,
                `> ${neutral(r.comment || '').replace(/\n/g, '\n> ')}`,
                ...fotter,
              ].join('\n')
              await forsok(`kommentar ${r.id}`, () => skapa(`Ny kommentar: ${titel(r.station_name ?? r.station_id)}`, body, 'omdöme'))
            }
            core.info(`${created} nya gransknings-ärenden skapade.`)
            if (failed) core.warning(`${failed} rad(er) gick inte att göra ärende av – se varningarna ovan.`)
            if (vantar) {
              core.warning(
                `Taket på ${MAX_PER_RUN} ärenden per körning är nått – ${vantar} till väntar och tas nästa körning. ` +
                  `Är det spam? Rensa i Supabase (Table Editor → submissions/reviews, status 'rejected').`,
              )
            }
