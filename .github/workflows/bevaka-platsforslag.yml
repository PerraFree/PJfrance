name: Bevaka platsförslag

# Ser till att databasen är installerad, kollar sedan efter nya platsförslag
# och kommentarer, och öppnar ett GitHub-ärende per post. GitHub mejlar dig
# automatiskt. Godkänn genom att kommentera "godkänn" i ärendet.
# Kräver secret SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  issues: write
  contents: read

concurrency:
  group: platsforslag
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const token = process.env.SUPABASE_ACCESS_TOKEN
            let urlVar = process.env.SUPABASE_URL
            if (!urlVar && fs.existsSync('supabase.env')) {
              const m = fs.readFileSync('supabase.env', 'utf8').match(/VITE_SUPABASE_URL=(.+)/)
              if (m) urlVar = m[1].trim()
            }
            if (!token || !urlVar) {
              core.notice('SUPABASE_ACCESS_TOKEN eller Supabase-koppling saknas – hoppar över. Kör "Installera databasen" först (se docs/ADMIN.md).')
              return
            }
            const ref = new URL(urlVar).hostname.split('.')[0]
            const mgmtHeaders = { Authorization: `Bearer ${token}` }
            // Hämtar projektstatus och loggar HTTP-felet rakt av om anropet inte
            // lyckas (t.ex. ogiltig/utgången token) – annars blir `proj.status`
            // bara "undefined" i tysthet och man tror felaktigt att databasen
            // aldrig vaknar (hände sep 2026, se CLAUDE.md).
            const getProj = async () => {
              const res = await fetch(`https://api.supabase.com/v1/projects/${ref}`, { headers: mgmtHeaders })
              const body = await res.json().catch(() => ({}))
              if (!res.ok) {
                throw new Error(
                  `Supabase Management API svarade ${res.status} för projekt "${ref}": ` +
                    `${JSON.stringify(body).slice(0, 300)}. Kontrollera att SUPABASE_ACCESS_TOKEN ` +
                    `fortfarande är giltig (supabase.com/dashboard/account/tokens).`,
                )
              }
              return body
            }
            // Väck databasen om den är pausad (gratisprojekt somnar)
            let proj = await getProj()
            if (String(proj.status).startsWith('INACTIVE')) {
              core.info('Databasen är pausad – väcker den …')
              await fetch(`https://api.supabase.com/v1/projects/${ref}/restore`, { method: 'POST', headers: mgmtHeaders })
            }
            for (let i = 0; i < 40 && !String(proj.status).includes('ACTIVE_HEALTHY'); i++) {
              await new Promise((r) => setTimeout(r, 15_000))
              proj = await getProj()
              if (i % 4 === 0) core.info(`  … väntar på databasen: ${proj.status}`)
            }
            if (!String(proj.status).includes('ACTIVE_HEALTHY')) {
              core.setFailed(`Databasen vaknade inte i tid (${proj.status}). Nästa körning försöker igen.`)
              return
            }
            const q = async (query) => {
              const res = await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query }),
              })
              if (!res.ok) throw new Error(`Supabase svarade ${res.status}: ${await res.text()}`)
              return res.json()
            }

            // 0) Självläkning: se till att alla tabeller/regler finns (idempotent)
            await q(fs.readFileSync('supabase/schema.sql', 'utf8'))

            // Befintliga gransknings-ärenden (dedup)
            const labels = ['platsförslag', 'omdöme']
            const existing = []
            for (const label of labels) {
              const found = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: label,
                state: 'all',
                per_page: 100,
              })
              existing.push(...found)
            }
            // Markören ligger alltid FÖRST i ärendet – matcha bara där, så att
            // användartext aldrig kan förfalska/blockera en markör.
            const seen = (marker) => existing.some((i) => (i.body || '').startsWith(marker))
            // Sanera användartext (säkerhetsfynd 4, GHSA-72p3-7774-p8h3):
            // ta bort HTML-kommentarer, neutralisera @ och # så att ett
            // förslag inte kan notifiera godtyckliga GitHub-användare eller
            // länka ärenden via Pers repo, och gör texten säker i
            // markdown-tabellceller (| och radbrytningar).
            const neutral = (s) => String(s).replace(/<!--|-->/g, '').replace(/@/g, '&#64;').replace(/#/g, '&#35;')
            const cell = (v) =>
              neutral(v ?? '–')
                .replace(/\|/g, '\\|')
                .replace(/\r?\n/g, '<br>') || '–'
            // Titlar är ren text (HTML-entiteter visas som de är, @ ger ingen
            // notis där) – ta bara bort HTML-kommentarer och radbrytningar.
            const titel = (v) => String(v ?? '–').replace(/<!--|-->/g, '').replace(/\s+/g, ' ').trim() || '–'
            // GitHub vägrar titlar >256 tecken och brödtext >65 536 tecken
            // (säkerhetsfynd 3) – korta hellre än att låta ärendet fallera.
            const kortTitel = (s) => (s.length > 200 ? s.slice(0, 197) + '…' : s)
            const kortBody = (s) => (s.length > 60_000 ? s.slice(0, 59_900) + '\n\n… (texten är avkortad)' : s)
            const skapa = (title, body, label) =>
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: kortTitel(title),
                body: kortBody(body),
                labels: [label],
              })
            const fotter = [
              ``,
              `---`,
              `**Svara med en kommentar:**`,
              `- Skriv \`godkänn\` för att publicera`,
              `- Skriv \`neka\` för att avslå`,
            ]
            // Tak per körning (säkerhetsfynd 4): en spam-loop mot det öppna
            // REST-API:t ska inte kunna skapa tusentals ärenden/mejl. Resten
            // tas nästa körning (var 3:e timme), och en varning syns i loggen.
            const MAX_PER_RUN = 20
            let created = 0
            let failed = 0
            let vantar = 0
            // En rad som inte går att göra ärende av (säkerhetsfynd 3) får
            // inte stoppa övriga – logga och fortsätt.
            const forsok = async (vad, fn) => {
              if (created >= MAX_PER_RUN) {
                vantar++
                return
              }
              try {
                await fn()
                created++
              } catch (e) {
                failed++
                core.warning(`Kunde inte skapa ärende för ${vad}: ${e.message}`)
              }
            }

            // 1) Platsförslag
            const subs = await q(
              `select id,name,address,services,fee,description,lat,lon from submissions where status = 'pending' order by created_at asc`,
            )
            for (const r of subs) {
              const marker = `<!-- submission:${r.id} -->`
              if (seen(marker)) continue
              // services kan komma som JS-array eller Postgres-literal "{a,b}"
              const services = Array.isArray(r.services)
                ? r.services.join(', ')
                : String(r.services ?? '').replace(/^\{|\}$/g, '').split(',').filter(Boolean).join(', ')
              const body = [
                marker,
                `**Nytt platsförslag väntar på granskning**`,
                ``,
                `| | |`,
                `|---|---|`,
                `| **Namn** | ${cell(r.name)} |`,
                `| **Adress** | ${cell(r.address)} |`,
                `| **Tjänster** | ${cell(services)} |`,
                `| **Avgift** | ${cell(r.fee)} |`,
                `| **Kommentar** | ${cell(r.description)} |`,
                `| **Koordinater** | ${r.lat}, ${r.lon} |`,
                ``,
                `[📍 Google Maps](https://www.google.com/maps?q=${Number(r.lat)},${Number(r.lon)}) · [🗺 Tömningskartan](https://tomningskartan.se/?at=${Number(r.lat)},${Number(r.lon)},15)`,
                ...fotter,
              ].join('\n')
              await forsok(`förslag ${r.id}`, () => skapa(`Nytt platsförslag: ${titel(r.name)}`, body, 'platsförslag'))
            }

            // 2) Kommentarer/omdömen med text
            const revs = await q(
              `select id,station_id,station_name,rating,comment from reviews where status = 'pending' order by created_at asc`,
            )
            for (const r of revs) {
              const marker = `<!-- review:${r.id} -->`
              if (seen(marker)) continue
              const body = [
                marker,
                `**Ny kommentar väntar på granskning**`,
                ``,
                `| | |`,
                `|---|---|`,
                `| **Plats** | ${cell(r.station_name ?? r.station_id)} |`,
                `| **Betyg** | ${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)} (${r.rating}/5) |`,
                ``,
                `> ${neutral(r.comment || '').replace(/\n/g, '\n> ')}`,
                ...fotter,
              ].join('\n')
              await forsok(`kommentar ${r.id}`, () => skapa(`Ny kommentar: ${titel(r.station_name ?? r.station_id)}`, body, 'omdöme'))
            }
            core.info(`${created} nya gransknings-ärenden skapade.`)
            if (failed) core.warning(`${failed} rad(er) gick inte att göra ärende av – se varningarna ovan.`)
            if (vantar) {
              core.warning(
                `Taket på ${MAX_PER_RUN} ärenden per körning är nått – ${vantar} till väntar och tas nästa körning. ` +
                  `Är det spam? Rensa i Supabase (Table Editor → submissions/reviews, status 'rejected').`,
              )
            }
