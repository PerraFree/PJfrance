name: TMP hämta källsidor (tas bort efter användning)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Hämta kandidaternas egna sidor
        run: |
          mkdir -p ut && cd ut
          cat > urls.json <<'EOF'
          ["https://www.svenskastallplatser.se/", "https://stellplatz.app/", "https://www.husbil.se/stallplatser/", "https://www.vastsverige.com/bo/stallplatser/", "https://www.visitblekinge.se/stallplatser-i-blekinge", "https://www.parkandstay.se/", "https://www.gotakanal.se/sv/stallplatser", "https://husbilsplats.se/hitta-husbilsplatser/", "https://husbilslivet.se/stallplatser/", "https://www.campingspot.com/sv/marina-manage", "https://firstcamp.se/campingtips/stallplatser", "https://www.hogakusten.com/sv/boende/stallplatser", "https://lwhusvagnar.se/husvagnssemester-sommar-stallplatser-du-maste-besoka", "https://vardnas.se/boende/stallplatser_husbilar.html", "https://play.google.com/store/apps/details?id=com.greenstream.stellplatz.free&hl=sv"]
          EOF
          cat > hamta.mjs <<'JS'
          import fs from 'node:fs'
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          const urls = JSON.parse(fs.readFileSync('urls.json', 'utf8'))
          const text = (h) => h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&nbsp;/g, ' ').replace(/&quot;/g, '"').replace(/&#x27;|&#39;/g, "'").replace(/&aring;/g, 'å').replace(/&auml;/g, 'ä').replace(/&ouml;/g, 'ö').replace(/\s+/g, ' ').slice(0, 60000)
          const KW = /husbil|st[aä]llplats|stallplats|stellplatz|camping|marina|hamn|produkter|boende/i
          async function get(u) {
            try {
              const r = await fetch(u, { headers: { 'user-agent': UA }, redirect: 'follow', signal: AbortSignal.timeout(25000) })
              const h = await r.text()
              return { status: r.status, final: r.url, html: h }
            } catch (e) { return { status: 0, err: String(e).slice(0, 200) } }
          }
          const out = {}
          const q = [...urls]
          await Promise.all(Array.from({ length: 3 }, async () => {
            while (q.length) {
              const u = q.shift()
              const r = await get(u)
              const pages = [{ u, status: r.status, err: r.err, text: r.html ? text(r.html) : '', html: (r.html || '').slice(0, 4000000) }]
              if (r.html) {
                const base = new URL(r.final || u)
                const links = [...new Set([...r.html.matchAll(/href="([^"#]+)"/g)].map((m) => { try { return new URL(m[1], base).href } catch { return null } }).filter((x) => x && new URL(x).host === base.host && KW.test(x) && !/\.(jpg|png|pdf|css|js)$/i.test(x)))].slice(0, 80)
                for (const l of links) { const s = await get(l); pages.push({ u: l, status: s.status, text: s.html ? text(s.html) : '', geo: s.html ? [...s.html.matchAll(/(5[5-9]|6[0-9])\.\d{3,}[^0-9]{1,40}?(1[0-9]|2[0-4])\.\d{3,}/g)].slice(0, 5).map((m) => m[0]) : [] }) }
              }
              out[u] = pages
            }
          }))
          fs.writeFileSync("kallor-per.json", JSON.stringify(out))
          console.log('klart', Object.keys(out).length, Object.values(out).filter((p) => p[0].status === 200).length, 'ok')
          JS
          node hamta.mjs
          rm hamta.mjs urls.json
      - name: Publicera till grenen tmp-kallsidor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ut
          git init -q -b tmp-kallsidor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "tmp källsidor"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp-kallsidor
