          EOF
          cat > hamta.mjs <<'JS'
          import fs from 'node:fs'
          import { chromium } from 'playwright'
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          const urls = JSON.parse(fs.readFileSync('urls.json', 'utf8'))
          const ent = { aring: 'å', auml: 'ä', ouml: 'ö', Aring: 'Å', Auml: 'Ä', Ouml: 'Ö', eacute: 'é', ndash: '–', mdash: '—', bull: '•', amp: '&', nbsp: ' ', quot: '"', rsquo: '’' }
          const text = (h) => h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&([a-zA-Z]+);/g, (m, n) => ent[n] ?? m).replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/&#x([0-9a-f]+);/gi, (m, n) => String.fromCharCode(parseInt(n, 16))).replace(/\s+/g, ' ')
          const RE = /latrin|kassett|toat[öo]mning|toalettt[öo]mning|kemtoa|svartvatten|septi|gr[åa]vatten|spillvatten|f[äa]rskvatten|vattenp[åa]fyll|p[åa]fyllning av vatten|fylla på vatten|fylla vatten|dricksvatten|vattenpost|vattenkran|t[öo]mningsstation|t[öo]mning|gasol|fresh water|grey water|gray water|chemical toilet|drinking water|dump station|nedlagd|stängd|upphör/gi
          const snips = (t) => { const out = []; let last = -1000; for (const m of t.matchAll(RE)) { if (m.index - last < 180) continue; last = m.index; out.push(t.slice(Math.max(0, m.index - 260), m.index + 260)); if (out.length >= 15) break } return out }
          async function get(u) { try { const r = await fetch(u, { headers: { 'user-agent': UA, 'accept-language': 'sv-SE,sv;q=0.9' }, redirect: 'follow', signal: AbortSignal.timeout(20000) }); return { status: r.status, html: await r.text() } } catch (e) { return { status: 0, err: String(e.cause?.code || e.name || e).slice(0, 60) } } }
          const out = {}; const q = [...urls]; let n = 0
          await Promise.all(Array.from({ length: 10 }, async () => {
            while (q.length) { const u = q.shift(); const r = await get(u); const t = r.html ? text(r.html) : ''; out[u] = { status: r.status, err: r.err, len: t.length, s: snips(t) }; if (++n % 200 === 0) console.log(n) }
          }))
          const redo = Object.entries(out).filter(([, v]) => v.status !== 200 || v.len < 2500 || !v.s.length).map(([u]) => u)
          console.log('renderar', redo.length)
          const browser = await chromium.launch({ channel: 'chrome' })
          const ctx = await browser.newContext({ userAgent: UA, locale: 'sv-SE' })
          const rq = [...redo]
          await Promise.all(Array.from({ length: 4 }, async () => {
            const pg = await ctx.newPage()
            while (rq.length) { const u = rq.shift(); try { const r = await pg.goto(u, { waitUntil: 'networkidle', timeout: 30000 }); await pg.waitForTimeout(1500); const t = text(await pg.content()); out[u] = { status: r ? r.status() : 0, len: t.length, s: snips(t), rendered: true } } catch (e) { out[u].renderErr = String(e).slice(0, 80) } }
          }))
          await browser.close()
          fs.writeFileSync('regsidor.json', JSON.stringify(out))
          console.log('klart', Object.keys(out).length)
          JS
          node hamta.mjs
          rm -rf hamta.mjs urls.json node_modules package.json package-lock.json
