"http://forsbergsfritidscenter.se/center/bjuv", "https://www.holmgrensbil.se/fritid", "http://www.husvagnar.com", "https://www.svenskagas.se/gasolautomat", "https://forsaljningsstallen.linde.se/oxie/oxie-kyrkov%C3%A4g-212/aga-gasolautomat-ica-n%C3%A4ra", "http://forsbergsfritidscenter.se/center/hyssna", "https://rudvi.se/rudvi-fritid/", "https://www.hallqvistbil.se", "https://www.erikssonshusvagnar.se", "https://forsaljningsstallen.linde.se/enh%C3%B6rna/b%C3%A4verstigen-1/aga-gasolautomat-enh%C3%B6rna", "http://www.macmoller.se", "http://www.lwhusvagnar.se", "https://husbilslandet.com", "http://www.ctservice.se", "http://www.caravanmarine.se", "http://www.dags.se", "https://www.mfritid.se/", "http://www.fordonstek.se"]
          EOF
          cat > hamta.mjs <<'JS'
          import fs from 'node:fs'
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          const urls = JSON.parse(fs.readFileSync('urls.json', 'utf8'))
          const text = (h) => h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&nbsp;/g, ' ').replace(/&quot;/g, '"').replace(/&#x27;|&#39;/g, "'").replace(/&aring;/g, 'å').replace(/&auml;/g, 'ä').replace(/&ouml;/g, 'ö').replace(/\s+/g, ' ').slice(0, 60000)
          const KW = /husbil|st[aä]llplats|service|camping|gasol|pris|facilitet|tomning|t[oö]mning|om-oss|info/i
          async function get(u) {
            try {
              const r = await fetch(u, { headers: { 'user-agent': UA }, redirect: 'follow', signal: AbortSignal.timeout(25000) })
              const h = await r.text()
              return { status: r.status, final: r.url, html: h }
            } catch (e) { return { status: 0, err: String(e).slice(0, 200) } }
          }
          const out = {}
          const q = [...urls]
          await Promise.all(Array.from({ length: 6 }, async () => {
            while (q.length) {
              const u = q.shift()
              const r = await get(u)
              const pages = [{ u, status: r.status, err: r.err, text: r.html ? text(r.html) : '' }]
              if (r.html) {
                const base = new URL(r.final || u)
                const links = [...new Set([...r.html.matchAll(/href="([^"#]+)"/g)].map((m) => { try { return new URL(m[1], base).href } catch { return null } }).filter((x) => x && new URL(x).host === base.host && KW.test(x) && !/\.(jpg|png|pdf|css|js)$/i.test(x)))].slice(0, 6)
                for (const l of links) { const s = await get(l); pages.push({ u: l, status: s.status, text: s.html ? text(s.html) : '' }) }
              }
              out[u] = pages
            }
          }))
          fs.writeFileSync('kallsidor.json', JSON.stringify(out))
          console.log('klart', Object.keys(out).length, Object.values(out).filter((p) => p[0].status === 200).length, 'ok')
          JS
          node hamta.mjs
          rm hamta.mjs urls.json
      - name: Publicera till grenen tmp-kallsidor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ut
          git init -q -b tmp-kallsidor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "tmp källsidor"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp-kallsidor
