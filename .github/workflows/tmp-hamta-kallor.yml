name: TMP hämta källsidor (tas bort efter användning)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Göta kanals ställplatser (sitemap + renderat)
        run: |
          mkdir -p ut && cd ut
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          cat > gk.mjs <<'JS'
          import fs from 'node:fs'
          import { chromium } from 'playwright'
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          const ent = { aring: 'å', auml: 'ä', ouml: 'ö', Aring: 'Å', Auml: 'Ä', Ouml: 'Ö', ndash: '–', amp: '&', nbsp: ' ', quot: '"' }
          const text = (h) => h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&([a-zA-Z]+);/g, (m, n) => ent[n] ?? m).replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/\s+/g, ' ')
          const urls = new Set()
          for (const sm of ['https://www.gotakanal.se/sitemap.xml', 'https://www.gotakanal.se/sitemap.xml?page=2', 'https://www.gotakanal.se/sitemap.xml?page=3']) {
            try { const x = await (await fetch(sm, { headers: { 'user-agent': UA } })).text(); for (const m of x.matchAll(/<loc>([^<]+)<\/loc>/g)) if (/st[aä]llplats|motorhome|stellpl|husbil|camping/i.test(m[1])) urls.add(m[1]) } catch {}
          }
          const browser = await chromium.launch({ channel: 'chrome' })
          const pg = await browser.newPage({ userAgent: UA })
          for (const start of ['https://www.gotakanal.se/sv/stallplatser', 'https://www.gotakanal.se/en/motorhome-spaces']) {
            try {
              await pg.goto(start, { waitUntil: 'networkidle', timeout: 60000 })
              for (let i = 0; i < 15; i++) { await pg.mouse.wheel(0, 3000); await pg.waitForTimeout(500) }
              const h = await pg.content()
              for (const m of h.matchAll(/href="([^"#]+)"/g)) { try { const u = new URL(m[1].replace(/&amp;/g, '&'), start).href; if (/gotakanal\.se/.test(u) && /st[aä]llplats|stays\/village|motorhome/i.test(u)) urls.add(u.split('?')[0]) } catch {} }
            } catch {}
          }
          console.log('urls', urls.size)
          const out = {}
          for (const u of urls) {
            try {
              await pg.goto(u, { waitUntil: 'networkidle', timeout: 60000 }); await pg.waitForTimeout(2500)
              for (const b of await pg.$$('button, summary, [role=button]')) { const t = (await b.innerText().catch(() => '')).trim(); if (/visa mer|läs mer|faciliteter|service|bekvämlighet|show more|read more|facilities/i.test(t)) await b.click({ timeout: 1500 }).catch(() => {}) }
              await pg.waitForTimeout(1500)
              const h = await pg.content()
              const geo = [...h.matchAll(/(5[5-9]\.\d{4,})[^0-9]{1,40}?(1[0-9]\.\d{4,})/g)].slice(0, 3).map((m) => m[1] + ',' + m[2])
              out[u] = { geo, text: text(h).slice(0, 40000) }
            } catch (e) { out[u] = { err: String(e).slice(0, 150) } }
          }
          await browser.close()
          fs.writeFileSync('gotakanal.json', JSON.stringify(out))
          console.log('klart', Object.keys(out).length)
          JS
          node gk.mjs
          rm -rf gk.mjs node_modules package.json package-lock.json
      - name: Publicera till grenen tmp-kallsidor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ut
          git init -q -b tmp-kallsidor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "tmp källsidor"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp-kallsidor
