name: TMP hämta källsidor (tas bort efter användning)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Läs husbil.se + turistrådens ställplatslistor
        run: |
          mkdir -p ut && cd ut
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          cat > crawl.mjs <<'JS'
          import fs from 'node:fs'
          import { chromium } from 'playwright'
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          const text = (h) => h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&nbsp;|&#160;/g, ' ').replace(/&#187;/g, '»').replace(/\s+/g, ' ')
          // 1) husbil.se
          const hb = []
          const ids = Array.from({ length: 1500 }, (_, i) => i + 1)
          await Promise.all(Array.from({ length: 4 }, async () => {
            while (ids.length) {
              const id = ids.shift()
              try {
                const r = await fetch(`https://www.husbil.se/stallplatser/p/${id}`, { headers: { 'user-agent': UA }, signal: AbortSignal.timeout(25000) })
                if (r.ok) { const h = await r.text(); const web = (h.match(/href="([^"]+)"[^>]*>\s*Webbplats/) || [])[1]; hb.push({ id, web, text: text(h).slice(0, 8000) }) }
              } catch {}
              await new Promise((s) => setTimeout(s, 200))
            }
          }))
          fs.writeFileSync('husbilse.json', JSON.stringify(hb))
          console.log('husbil.se', hb.length)
          // 2) turistråd (JS-renderade listor)
          const browser = await chromium.launch({ channel: 'chrome' })
          const out = {}
          for (const u of ['https://www.vastsverige.com/bo/stallplatser/', 'https://www.visitblekinge.se/stallplatser-i-blekinge', 'https://www.hogakusten.com/sv/boende/stallplatser', 'https://www.gotakanal.se/sv/stallplatser']) {
            try {
              const pg = await browser.newPage({ userAgent: UA })
              await pg.goto(u, { waitUntil: 'networkidle', timeout: 60000 })
              for (let i = 0; i < 25; i++) {
                await pg.mouse.wheel(0, 4000); await pg.waitForTimeout(700)
                const more = await pg.$('button:has-text("Visa fler"), button:has-text("Ladda fler"), a:has-text("Visa fler")')
                if (more) { try { await more.click(); await pg.waitForTimeout(1500) } catch {} }
              }
              const html = await pg.content()
              const host = new URL(u).host
              const links = [...new Set([...html.matchAll(/href="([^"#]+)"/g)].map((m) => { try { return new URL(m[1].replace(/&amp;/g, '&'), u).href } catch { return null } }).filter((x) => x && new URL(x).host === host && /produkter|\/boende\/|stallplats|ställplats|camping|hamn/i.test(x)))]
              const pages = []
              for (const l of links.slice(0, 250)) {
                try { const r = await fetch(l, { headers: { 'user-agent': UA }, signal: AbortSignal.timeout(25000) }); const h = await r.text(); pages.push({ u: l, status: r.status, text: text(h).slice(0, 20000), geo: [...h.matchAll(/(5[5-9]|6[0-9])\.\d{3,}[^0-9]{1,40}?(1[0-9]|2[0-4])\.\d{3,}/g)].slice(0, 3).map((m) => m[0]) }) } catch {}
              }
              out[u] = { list: text(html).slice(0, 200000), links, pages }
              console.log(u, links.length, pages.length)
            } catch (e) { out[u] = { err: String(e) }; console.log(u, 'fel', String(e).slice(0, 200)) }
          }
          await browser.close()
          fs.writeFileSync('turistrad.json', JSON.stringify(out))
          JS
          node crawl.mjs
          rm -rf crawl.mjs node_modules package.json package-lock.json
      - name: Publicera till grenen tmp-kallsidor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ut
          git init -q -b tmp-kallsidor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "tmp källsidor"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp-kallsidor
