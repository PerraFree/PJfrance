          EOF
          cat > hamta.mjs <<'JS'
          import fs from 'node:fs'
          import { chromium } from 'playwright'
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          const { own, render } = JSON.parse(fs.readFileSync('urls.json', 'utf8'))
          const ent = { aring: 'å', auml: 'ä', ouml: 'ö', Aring: 'Å', Auml: 'Ä', Ouml: 'Ö', eacute: 'é', ndash: '–', mdash: '—', bull: '•', amp: '&', nbsp: ' ', quot: '"', rarr: '→' }
          const text = (h) => h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&([a-zA-Z]+);/g, (m, n) => ent[n] ?? m).replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/&#x([0-9a-f]+);/gi, (m, n) => String.fromCharCode(parseInt(n, 16))).replace(/\s+/g, ' ')
          const RE = /latrin|kassett|toat[öo]mning|toalettt[öo]mning|kemtoa|svartvatten|septi|gr[åa]vatten|spillvatten|f[äa]rskvatten|vattenp[åa]fyll|p[åa]fyllning av vatten|fylla på vatten|fylla vatten|dricksvatten|vattenpost|vattenkran|tappst[äa]lle|vatten och el|el och vatten|el, vatten|vatten, el|t[öo]mningsstation|t[öo]mning av|fresh water|grey water|chemical toilet|drinking water/gi
          const snips = (t) => { const out = []; let last = -1000; for (const m of t.matchAll(RE)) { if (m.index - last < 200) continue; last = m.index; out.push(t.slice(Math.max(0, m.index - 260), m.index + 260)); if (out.length >= 12) break } return out }
          const KW = /husbil|st[aä]llplats|service|camping|pris|facilitet|t[oö]mning|info|boende|gast|gäst|hamn|om-oss|om/i
          async function get(u) { try { const r = await fetch(u, { headers: { 'user-agent': UA }, redirect: 'follow', signal: AbortSignal.timeout(20000) }); return { status: r.status, final: r.url, html: await r.text() } } catch (e) { return { status: 0 } } }
          const out = {}
          const q = [...own]; let n = 0
          await Promise.all(Array.from({ length: 8 }, async () => {
            while (q.length) {
              const u = q.shift(); const r = await get(u)
              const pages = []
              if (r.html) {
                pages.push({ u: r.final || u, s: snips(text(r.html)) })
                let base; try { base = new URL(r.final || u) } catch { base = null }
                if (base) {
                  const links = [...new Set([...r.html.matchAll(/href="([^"#]+)"/g)].map((m) => { try { return new URL(m[1].replace(/&amp;/g, '&'), base).href } catch { return null } }).filter((x) => x && new URL(x).host === base.host && KW.test(x) && !/\.(jpg|jpeg|png|pdf|css|js|svg|webp)$/i.test(x)))].slice(0, 8)
                  for (const l of links) { const s = await get(l); if (s.html) pages.push({ u: l, s: snips(text(s.html)) }) }
                }
              }
              out[u] = { status: r.status, pages: pages.filter((p) => p.s.length) }
              if (++n % 100 === 0) console.log(n)
            }
          }))
          const browser = await chromium.launch({ channel: 'chrome' })
          for (const u of [...render, ...Object.entries(out).filter(([, v]) => !v.pages.length).map(([k]) => k)]) {
            try {
              const pg = await browser.newPage({ userAgent: UA }); await pg.goto(u, { waitUntil: 'domcontentloaded', timeout: 30000 })
              for (const b of await pg.$$('button, a')) { const t = (await b.innerText().catch(() => '')).trim(); if (/^(Visa mer|Läs mer|Faciliteter|Service)/i.test(t)) { await b.click({ timeout: 2000 }).catch(() => {}) } }
              await pg.waitForTimeout(3500)
              const t = text(await pg.content()); out[u] = { status: 200, pages: [{ u, s: snips(t), full: t.slice(0, 30000) }] }; await pg.close()
            } catch (e) { out[u] = { status: 0, pages: [] } }
          }
          await browser.close()
          fs.writeFileSync('runda5.json', JSON.stringify(out))
          console.log('klart', Object.keys(out).length)
          JS
          node hamta.mjs
          rm -rf hamta.mjs urls.json node_modules package.json package-lock.json
      - name: Publicera till grenen tmp-kallsidor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ut
          git init -q -b tmp-kallsidor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "tmp källsidor"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp-kallsidor
