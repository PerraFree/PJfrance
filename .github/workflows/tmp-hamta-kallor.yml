name: TMP hämta källsidor (tas bort efter användning)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Hämta husbil.se-kandidaternas sidor + Göta kanal (renderat)
        run: |
          mkdir -p ut && cd ut
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          cat > urls.json <<'EOF'
          {"own": ["https://www.skelleftea.se/stallplatscampus", "https://www.sandaholm.com", "https://www.mossholmen.se/", "https://www.karlskrona.se/kultur-fritid-och-turism/stadsmarina/", "https://www.halsohamn.se", "https://www.bjorkohamn.se/", "https://www.gotakanal.se/sv/stays/village/2630938/stallplats-lyrestad", "https://www.gotakanal.se/sv/stays/village/2729274/stallplats-norrqvarn?gc-0-adults=1", "https://www.varberg.se/trafik-och-gator/parkering/stallplatser-for-husbil-eller-husvagn", "https://www.cco.se/aslerod/", "https://www.rodlixvandrarhem.se/boende-44356351", "https://www2.visitsmaland.se/sv/boende/a402837/djupasj%C3%B6ns-naturcamping/detaljer", "https://www.stallplats.ardre.se/", "https://www.ekogarden.se", "https://www.falsterbokanalen.se", "https://www.nya-skogsgarden.com", "https://www.vanersborgsmarina.se", "https://www.westerqwarn.se", "https://www.karlshamn.se/VisitKarlshamn/", "https://www.majenfors.se", "https://www.fotevikensmuseum.se/d/besok/stallplats", "https://www.tykarpsgrottanscamping.net", "https://www.stegeborg.se/camping/stallplats-camping/", "https://www.brofastetsenoren.se", "https://www.stugohusbil.se/", "https://stockahamn.se", "https://www.kustvy.se/", "https://strangnashamn.se/", "https://kungshamnsvandrarhem.se/", "https://billingensgk.se/gast/stugorstallplatser/", "https://www.askersundsgk.se/camping/", "https://www.kumlagk.se/gast/golfcamp/", "https://www.moragk.se", "https://www.salagk.nu/", "https://tosteberga.se/tosteberga-fiskehamnsforening/", "https://www.fotohamn.se/gasthamn/", "https://www.hyppeln.com", "https://www.honoklova.se", "https://www.stampenskvarn.nu", "https://www.kvarkenfisk.se/sv/stallplats.htm", "https://www.sandvikscamping.com/", "https://upplev.valdemarsvik.se/bo-ata/stallplats-valdemarsviks-gasthamn/", "https://www.gatebison.se", "https://www.skallkroken.se/", "https://www.kvillsfors-loppis.se/310133718", "https://www.parkandstay.se", "https://www.odensvilanthandel.se/", "https://www.marincenter.se/", "https://www.skulebergethavscamping.se/stallplatser-faciliteter", "https://www.lysekil.se/trafik-och-resor/trafik-och-gator/husbilsparkering.html", "https://www.furulid.se", "https://www.sangiscamping.se/", "https://stnautobook1.comers.se/", "https://www.hallevikscamping.se", "https://www.johannesvik.nu/", "https://www.kcsaxnas.se/", "https://festplatsenvannasby.se", "https://www.trollforsen.se/", "https://www.visingsostallplats.se/", "https://www.strandgarden.org/", "https://www.fiskevistet.se", "https://bollnas.se/", "https://leksands.se", "https://www.campgrinsby.se/", "https://www.stravallacamping.se", "https://www.rafsnasgarden.se/", "https://www.sandvikens.se", "https://mellerudsgolf.se/sv/stallplats-vid-golfbanan-husvagn-och-husbil", "https://dinhusbil.nu/stallplats/", "https://www.grandcircushotel.com", "https://www.kasteberg.com/stallplats", "https://www.nostalgimuseum.com", "https://www.fridafors-fritidscenter.se", "https://haknas.vandrarhem.dinstudio.se/", "https://www.grasmark.com", "https://www.rotvikenscamping.se/", "https://www.nossebrobadet.se", "https://www.stallplatskarlsborg.se", "https://rannudden.com/", "https://www.ammebergsbatklubb.nu", "https://www.caravanclub.se/camping/norrviken/", "https://www.frambyudde.se/", "https://revelbadetscamping.se", "https://www.fideaventyrsby.se/", "https://ellosparken.se/", "https://www.hagern.com/home/check-in", "https://www.laget.se/ginsten", "https://www.hembygd.se/rogsta", "https://www.sagnernashus.se/", "https://www.sjosidanfalun.se/", "https://www.maviken.com/", "https://www.visitsagaliden.se/boende-bokning", "https://firstcamp.se/destinationer/okno-monsteras", "https://www.julared.se/", "https://holjescamping.wordpress.com/", "https://www.fiskepuben.com/", "https://www.osthammar.se/sv/boendetrafikmiljo/trafik-snorojning-och-resor/husbilsparkeringstallplats/", "https://emmabodagk.se/boende/stallplatser/", "https://vara-bjertorpgk.se/?page_id=7080", "https://www.grasmyrloge.se", "https://www.facebook.com/share/18fh6KQHGY/?mibextid=wwXIfr", "https://www.vannascamping.se", "https://www.bergbycampingvaddo.se", "https://visit.norrkoping.se/overnatta/campingplatser/campingplatser-10-15-minuter-fran-city/stallplatser-for-husbil-i-himmelstalund", "https://destinationmockeln.se", "https://www.ostanahavscamp.se", "https://www.storaekeberg.se", "https://strandstugby.se/boende/"], "render": ["https://www.gotakanal.se/sv/stays/village/2811988/toreboda-camping-bad?gc-0-adults=1&geo=111488", "https://www.gotakanal.se/sv/stays/village/2642448/stallplats-malfors", "https://www.gotakanal.se/sv/stays/village/2630938/stallplats-lyrestad", "https://www.gotakanal.se/sv/stays/village/2717997/stallplats-ljungs-vastra", "https://www.gotakanal.se/sv/stays/village/2815271/stallplats-tatorp", "https://www.gotakanal.se/sv/stays/village/2849882/stallplats-borenshult", "https://www.gotakanal.se/sv/stays/village/2617272/stallplats-sjotorp-norra", "https://www.gotakanal.se/sv/stays/village/2633672/stallplats-soderkoping", "https://www.gotakanal.se/sv/stays/village/2655246/stallplats-motala-verkstad", "https://www.gotakanal.se/sv/stays/village/2630738/stallplats-sjotorp-sodra", "https://www.gotakanal.se/sv/stays/village/2729274/stallplats-norrqvarn?gc-0-adults=1", "https://www.gotakanal.se/sv/stays/village/2631733/stallplats-camping-vassbacken", "https://www.gotakanal.se/sv/stays/village/2630674/stallplats-forsvik"]}
          EOF
          cat > hamta.mjs <<'JS'
          import fs from 'node:fs'
          import { chromium } from 'playwright'
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          const { own, render } = JSON.parse(fs.readFileSync('urls.json', 'utf8'))
          const text = (h) => h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&nbsp;|&#160;/g, ' ').replace(/&ndash;|&#8211;/g, '–').replace(/&#8217;/g, '’').replace(/&aring;/g, 'å').replace(/&auml;/g, 'ä').replace(/&ouml;/g, 'ö').replace(/&Aring;/g, 'Å').replace(/&Auml;/g, 'Ä').replace(/&Ouml;/g, 'Ö').replace(/\s+/g, ' ').slice(0, 60000)
          const KW = /husbil|st[aä]llplats|service|camping|pris|facilitet|t[oö]mning|info|boende|gast|gäst|hamn/i
          async function get(u) {
            try { const r = await fetch(u, { headers: { 'user-agent': UA }, redirect: 'follow', signal: AbortSignal.timeout(25000) }); return { status: r.status, final: r.url, html: await r.text() } } catch (e) { return { status: 0, err: String(e).slice(0, 200) } }
          }
          const out = {}
          const q = [...own]
          await Promise.all(Array.from({ length: 6 }, async () => {
            while (q.length) {
              const u = q.shift(); const r = await get(u)
              const pages = [{ u, status: r.status, err: r.err, text: r.html ? text(r.html) : '' }]
              if (r.html) {
                const base = new URL(r.final || u)
                const links = [...new Set([...r.html.matchAll(/href="([^"#]+)"/g)].map((m) => { try { return new URL(m[1], base).href } catch { return null } }).filter((x) => x && new URL(x).host === base.host && KW.test(x) && !/\.(jpg|png|pdf|css|js)$/i.test(x)))].slice(0, 8)
                for (const l of links) { const s = await get(l); pages.push({ u: l, status: s.status, text: s.html ? text(s.html) : '' }) }
              }
              out[u] = pages
            }
          }))
          const browser = await chromium.launch({ channel: 'chrome' })
          for (const u of render) {
            try { const pg = await browser.newPage({ userAgent: UA }); await pg.goto(u, { waitUntil: 'networkidle', timeout: 60000 }); await pg.waitForTimeout(3000); out[u] = [{ u, status: 200, text: text(await pg.content()) }]; await pg.close() } catch (e) { out[u] = [{ u, status: 0, err: String(e).slice(0, 200), text: '' }] }
          }
          await browser.close()
          fs.writeFileSync('kallsidor2.json', JSON.stringify(out))
          console.log('klart', Object.keys(out).length)
          JS
          node hamta.mjs
          rm -rf hamta.mjs urls.json node_modules package.json package-lock.json
      - name: Publicera till grenen tmp-kallsidor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ut
          git init -q -b tmp-kallsidor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "tmp källsidor"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp-kallsidor
