name: TMP hämta källsidor (tas bort efter användning)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Hämta registrets källsidor (utdrag, JS-sidor renderade)
        run: |
          mkdir -p ut && cd ut
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          cat > urls.json <<'EOF'
          ["https://www.campingalingsas.com/", "https://hamn.lysekil.se/", "https://www.lysekil.se/", "https://stenungsogarden.se/", "https://www.vafabmiljo.se/", "https://tidaholmscamping.se/", "https://www.maplelake.se/", "https://www.liseberg.se/sv/bo/lisebergsbyn/", "https://amal.se/uppleva-och-gora/turism/vara-olika-boenden/camping-stugor-och-stallplats/", "https://www.vastsverige.com/dals-ed/produkter/sjostugetomten/", "https://lovekulle.se/", "https://www.gasolstationen.se/gasolautomater", "https://expressgasol.se/", "https://www.norbro.se/privat/hitta-gasolautomat/", "https://www.edsbyn.se/", "https://www.gnesta.se/", "https://www.hultsfred.se/"]
          EOF
          cat > hamta.mjs <<'JS'
          import fs from 'node:fs'
          import { chromium } from 'playwright'
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          const urls = JSON.parse(fs.readFileSync('urls.json', 'utf8'))
          const ent = { aring: 'å', auml: 'ä', ouml: 'ö', Aring: 'Å', Auml: 'Ä', Ouml: 'Ö', eacute: 'é', ndash: '–', mdash: '—', bull: '•', amp: '&', nbsp: ' ', quot: '"', rsquo: '’' }
          const text = (h) => h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&([a-zA-Z]+);/g, (m, n) => ent[n] ?? m).replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/&#x([0-9a-f]+);/gi, (m, n) => String.fromCharCode(parseInt(n, 16))).replace(/\s+/g, ' ')
          const RE = /latrin|kassett|toat[öo]mning|toalettt[öo]mning|kemtoa|svartvatten|septi|gr[åa]vatten|spillvatten|f[äa]rskvatten|vattenp[åa]fyll|p[åa]fyllning av vatten|fylla på vatten|fylla vatten|dricksvatten|vattenpost|vattenkran|t[öo]mningsstation|t[öo]mning|gasol|fresh water|grey water|gray water|chemical toilet|drinking water|dump station|nedlagd|stängd|upphör/gi
          const snips = (t) => { const out = []; let last = -1000; for (const m of t.matchAll(RE)) { if (m.index - last < 180) continue; last = m.index; out.push(t.slice(Math.max(0, m.index - 260), m.index + 260)); if (out.length >= 15) break } return out }
          async function get(u) { try { const r = await fetch(u, { headers: { 'user-agent': UA, 'accept-language': 'sv-SE,sv;q=0.9' }, redirect: 'follow', signal: AbortSignal.timeout(20000) }); return { status: r.status, html: await r.text() } } catch (e) { return { status: 0, err: String(e.cause?.code || e.name || e).slice(0, 60) } } }
          const out = {}; const q = []; let n = 0
          await Promise.all(Array.from({ length: 10 }, async () => {
            while (q.length) { const u = q.shift(); const r = await get(u); const t = r.html ? text(r.html) : ''; out[u] = { status: r.status, err: r.err, len: t.length, s: snips(t) }; if (++n % 200 === 0) console.log(n) }
          }))
          const redo = [...urls]
          console.log('renderar', redo.length)
          const browser = await chromium.launch({ channel: 'chrome' })
          const ctx = await browser.newContext({ userAgent: UA, locale: 'sv-SE' })
          const rq = [...redo]
          await Promise.all(Array.from({ length: 4 }, async () => {
            const pg = await ctx.newPage()
            while (rq.length) { const u = rq.shift(); try { const r = await pg.goto(u, { waitUntil: 'networkidle', timeout: 30000 }); await pg.waitForTimeout(1500); const t = text(await pg.content()); const links = await pg.$$eval('a[href]', (as) => as.map((a) => a.href)).catch(() => []); out[u] = { status: r ? r.status() : 0, text: t.slice(0, 40000), links: [...new Set(links)].filter((l) => /husbil|st[aä]llplats|t[öo]mning|camping|gasol|automat|hamn/i.test(l)).slice(0, 40) } } catch (e) { out[u] = out[u] || {}; out[u].renderErr = String(e).slice(0, 80) } }
          }))
          await browser.close()
          fs.writeFileSync('rest28.json', JSON.stringify(out))
          console.log('klart', Object.keys(out).length)
          JS
          node hamta.mjs
          rm -rf hamta.mjs urls.json node_modules package.json package-lock.json
      - name: Publicera till grenen tmp-kallsidor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ut
          git init -q -b tmp-kallsidor
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "tmp källsidor"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp-kallsidor
