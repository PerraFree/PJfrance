name: TILLFÄLLIG databastest (tas bort)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          set -a; . ./supabase.env; set +a
          B="$VITE_SUPABASE_URL"; K="$VITE_SUPABASE_ANON_KEY"
          H=(-H "apikey: $K" -H "Content-Type: application/json")
          [[ "$K" == eyJ* ]] && H+=(-H "Authorization: Bearer $K")
          echo "1 fotorad med påhittad fil (ska nekas):"
          curl -s -o /dev/null -w '%{http_code}\n' "${H[@]}" -X POST "$B/rest/v1/photos" \
            -d '{"station_id":"test-granskning","url":"'"$B"'/storage/v1/object/public/place-photos/test-granskning/999999999999.jpg"}'
          echo "2 uppladdning med otillåtet filnamn (ska nekas):"
          printf 'x' > x.jpg
          curl -s -o /dev/null -w '%{http_code}\n' -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: image/jpeg" \
            --data-binary @x.jpg "$B/storage/v1/object/place-photos/test-granskning/annat.html.jpg"
          T=$(date +%s%3N)
          echo "4a giltig uppladdning (ska fungera):"
          curl -s -w ' %{http_code}\n' -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: image/jpeg" \
            --data-binary @x.jpg "$B/storage/v1/object/place-photos/granskningstest/$T.jpg"
          echo "4b fotorad till den uppladdade filen (ska fungera):"
          curl -s -w ' %{http_code}\n' "${H[@]}" -X POST "$B/rest/v1/photos" \
            -d '{"station_id":"granskningstest","url":"'"$B"'/storage/v1/object/public/place-photos/granskningstest/'"$T"'.jpg"}'
          echo "3 läsning av sammanställning (ska fungera):"
          curl -s -o /dev/null -w '%{http_code}\n' "${H[@]}" "$B/rest/v1/verification_summary?select=station_id&limit=1"
