name: Bygg Android-app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/gravatten-latrin-app-sverige-aed0qg
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Bygg webbappen
        run: npm run build
      - name: Synka Capacitor
        run: npx cap sync android
      - name: Bygg debug-APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Ladda upp APK
        uses: actions/upload-artifact@v4
        with:
          name: tomningskartan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
