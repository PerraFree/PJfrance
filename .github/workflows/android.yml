name: Bygg Android-app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/gravatten-latrin-app-sverige-aed0qg
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Bygg webbappen
        run: npm run build
      - name: Synka Capacitor
        run: npx cap sync android
      - name: Bygg debug-APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Ladda upp APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tomningskartan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Startar den byggda APK:n i en Android-emulator, väntar in kartan och tar en
  # skärmdump (artefakt "emulator-skarmdump"). Fallerar om appen inte lever
  # efter 40 s eller om Capacitor rapporterar att webbinnehållet inte laddade.
  # Tillagt för issue #13 (okt 2026): "appen startar med kartan synlig".
  starttest:
    name: Starta appen i emulator
    needs: build
    runs-on: ubuntu-latest
    # contents: write behövs bara för att lägga skärmdumpen på grenen `emulator-skarmdump`
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tomningskartan-debug-apk
          path: apk
      - name: Aktivera KVM för emulatorn
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n se.tomningskartan.app/.MainActivity
            sleep 40
            adb shell screencap -p /sdcard/start.png
            adb pull /sdcard/start.png start.png
            adb logcat -d > logcat-full.txt
            grep -iE "Capacitor|chromium|tomningskartan" logcat-full.txt | tail -80 > logcat.txt || true
            echo "--- Capacitor-rader ur logcat:"; cat logcat.txt
            if ! adb shell pidof se.tomningskartan.app > /dev/null; then echo "::error::Appen körs inte längre efter 40 s (krasch?)"; exit 1; fi
            if grep -qiE "ERR_FILE_NOT_FOUND|net::ERR_|Uncaught (TypeError|ReferenceError|SyntaxError)" logcat.txt; then echo "::error::Webbinnehållet rapporterar fel i logcat"; exit 1; fi
            echo "Appen lever och inga laddningsfel i logcat."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: emulator-skarmdump
          path: |
            start.png
            logcat.txt
          if-no-files-found: warn
      # Artefakter går inte att hämta från Claude-sessionen (nedladdningen går via
      # blob.core.windows.net som är spärrat), så skärmdumpen läggs även på en egen
      # fristående gren som bara innehåller senaste skärmdump + logcat.
      - name: Publicera skärmdumpen på grenen emulator-skarmdump
        if: always()
        run: |
          [ -f start.png ] || { echo "Ingen skärmdump att publicera"; exit 0; }
          mkdir -p skarmdump && cp start.png skarmdump/ && cp logcat.txt skarmdump/ 2>/dev/null || true
          cd skarmdump
          git init -q -b emulator-skarmdump
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Skärmdump från emulatorstart av commit ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%MZ))" > README.md
          git add -A
          git commit -q -m "Emulator-skärmdump för ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" emulator-skarmdump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
