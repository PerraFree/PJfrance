name: Deploy-vakt (startar deployen om GitHub missade pushen)

# GitHub skapar ibland ingen "Deploy till GitHub Pages"-körning när grenen
# pushas (hände två gånger 29 sep 2026 – ingen push-körning alls, trots
# lyckad push). Den här vakten går var 15:e minut och jämför grenens topp
# med det som faktiskt är publicerat på gh-pages (deploy-commitens meddelande
# är "deploy: <sha>"). Ligger grenen före, med ändringar som påverkar
# appen, och ingen deploy pågår för toppen → starta deployen via
# workflow_dispatch (det går alltid igenom, till skillnad från push-händelsen).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: deploy-vakt
  cancel-in-progress: false

jobs:
  vakt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Jämför grenens topp med publicerad version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          HEAD=$(git rev-parse HEAD)
          git fetch --depth=1 origin gh-pages 2>/dev/null || { echo "Ingen gh-pages ännu – startar deploy."; gh workflow run deploy.yml --ref "$BRANCH"; exit 0; }
          DEPLOYED=$(git log -1 --format=%s origin/gh-pages | sed -n 's/^deploy: \([0-9a-f]\{40\}\).*/\1/p')
          echo "Grenens topp: $HEAD"
          echo "Publicerat:   ${DEPLOYED:-okänt}"
          # Stäng ett öppet "Deployen misslyckas"-ärende när det publicerade har
          # kommit ikapp (förut stängdes det aldrig, och medan det låg öppet
          # larmade nya fel inte – granskning 12 okt 2026).
          close_issue() {
            for n in $(gh issue list --repo "$REPO" --state open --author "app/github-actions" --search "Deployen misslyckas in:title" --json number --jq '.[].number'); do
              gh issue close "$n" --repo "$REPO" --comment "Deployen fungerar igen – publicerat ${DEPLOYED}." || true
            done
          }
          if [ "$HEAD" = "$DEPLOYED" ]; then
            echo "Publicerat = grenens topp. Inget att göra."
            close_issue
            exit 0
          fi
          # Har något som påverkar appen ändrats sedan det publicerade commitet?
          # (Dokumentation och cachefilerna räknas inte. Seeden RÄKNAS sedan 12 okt 2026:
          # om synkens dispatch av deployen missades låg ny data annars kvar opublicerad.)
          if [ -n "$DEPLOYED" ] && git cat-file -e "$DEPLOYED^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$DEPLOYED" "$HEAD" -- src public scripts index.html package.json package-lock.json vite.config.ts tsconfig.json supabase.env .github/workflows/deploy.yml | grep -v -e '^scripts/commons-image-cache.json$' -e '^scripts/geocode-cache.json$' -e '^scripts/import-tools/' || true)
            if [ -z "$CHANGED" ]; then
              echo "Bara dokumentation ändrad sedan deployen – ingen deploy behövs."
              close_issue
              exit 0
            fi
            echo "Ändrat sedan deployen:"; echo "$CHANGED"
          fi
          # Pågår/köar redan NÅGON deploy på grenen? Då väntar vi – att starta
          # en till skulle bara avbryta den (concurrency: cancel-in-progress)
          # och börja om från noll. Nästa vakt-tick avgör om toppen ändå
          # behöver en egen körning.
          RUNS=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?branch=$BRANCH&per_page=15")
          ACTIVE=$(echo "$RUNS" | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [ "$ACTIVE" != "0" ]; then echo "En deploy pågår redan på grenen – väntar."; exit 0; fi
          # Har deployen redan MISSLYCKATS för just den här toppen? Då hjälper
          # inte en ny körning var 15:e minut (t.ex. en kvalitetsvakt som
          # stoppar) – öppna ett ärende i stället (granskning 12 okt 2026).
          FAILED=$(echo "$RUNS" | jq -r --arg h "$HEAD" '[.workflow_runs[] | select(.head_sha==$h and .status=="completed")][0].conclusion // empty')
          # timed_out räknas också (deployen har timeout 20 min sedan 12 okt 2026)
          if [ "$FAILED" = "failure" ] || [ "$FAILED" = "timed_out" ]; then
            # Ett tillfälligt fel (npm-registret, audit-tjänsten, runnern) ska få
            # ETT nytt försök innan det larmas – annars låg sajten kvar på en
            # gammal version tills någon pushade (granskning 12 okt 2026).
            RUN_ID=$(echo "$RUNS" | jq -r --arg h "$HEAD" '[.workflow_runs[] | select(.head_sha==$h and .status=="completed")][0].id')
            ATTEMPT=$(echo "$RUNS" | jq -r --arg h "$HEAD" '[.workflow_runs[] | select(.head_sha==$h and .status=="completed")][0].run_attempt')
            if [ "$ATTEMPT" = "1" ]; then
              echo "Deployen för toppen misslyckades en gång – kör om den (run $RUN_ID)."
              gh run rerun "$RUN_ID" --repo "$REPO" --failed || gh run rerun "$RUN_ID" --repo "$REPO"
              exit 0
            fi
            URL=$(echo "$RUNS" | jq -r --arg h "$HEAD" '[.workflow_runs[] | select(.head_sha==$h and (.conclusion=="failure" or .conclusion=="timed_out"))][0].html_url')
            OPEN=$(gh issue list --repo "$REPO" --state open --author "app/github-actions" --search "Deployen misslyckas in:title" --json number --jq 'length')
            if [ "$OPEN" = "0" ]; then
              gh issue create --repo "$REPO" --title "Deployen misslyckas – sajten visar en äldre version" --label backlog --label prio-1 \
                --body "Deployen för \`$HEAD\` misslyckades: $URL. Vakten startar inte om den (det skulle bara misslyckas igen). Rätta felet och pusha – ärendet kan stängas när en deploy lyckats."
            fi
            echo "Deployen för toppen har misslyckats – ärende finns/skapat, ingen ny körning."; exit 0
          fi
          # Har den senaste LYCKADE deployen redan samma app-filer som toppen?
          # (t.ex. deployen gick igenom men dist var identisk, så gh-pages fick
          # ingen ny commit, eller bara dokumentation har tillkommit sedan dess)
          LAST_OK=$(echo "$RUNS" | jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].head_sha // empty')
          if [ -n "$LAST_OK" ] && git cat-file -e "$LAST_OK^{commit}" 2>/dev/null; then
            SINCE_OK=$(git diff --name-only "$LAST_OK" "$HEAD" -- src public scripts index.html package.json package-lock.json vite.config.ts tsconfig.json supabase.env .github/workflows/deploy.yml | grep -v -e '^scripts/commons-image-cache.json$' -e '^scripts/geocode-cache.json$' -e '^scripts/import-tools/' || true)
            if [ -z "$SINCE_OK" ]; then echo "Senaste lyckade deployen ($LAST_OK) täcker redan toppens app-filer."; close_issue; exit 0; fi
          fi
          echo "Ingen deploy täcker $HEAD – startar en nu."
          gh workflow run deploy.yml --ref "$BRANCH"
