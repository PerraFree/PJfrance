name: Synka stationsdata till repot

# Enda stället där stationsdatan synkas (OSM + Trafikverket + registret, ~30 min).
# Resultatet committas som public/data/stations-seed.json; därefter startas
# deploy.yml så att sajten byggs om från den nya seeden (issue #15). deploy.yml
# själv synkar inte längre – den tar bara den committade filen.
on:
  workflow_dispatch:
    inputs:
      tillat_bortfall:
        description: 'Godkänn ett stort bortfall av tömning/vatten/gasol jämfört med förra seeden (bara efter granskning av listan i ärendet)'
        type: boolean
        default: false
  push:
    branches:
      - claude/gravatten-latrin-app-sverige-aed0qg
    paths:
      - 'scripts/sync-stations.mjs'
      - 'scripts/curated-places.json'
      - '.github/workflows/sync-data.yml'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sync-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Hämta stationsdata (OSM + ev. Trafikverket)
        run: node scripts/sync-stations.mjs
        env:
          TRV_API_KEY: ${{ secrets.TRV_API_KEY }}
          REGISTER_DROPPED: register-bortfall.json
      # Granskning 12 okt 2026: förut kontrollerades seeden först i deployen –
      # en trasig seed (t.ex. Overpass svarade med 60 %, Trafikverket med fel)
      # committades och stoppade sedan ALLA deployer, även kodfixar, i upp till
      # en vecka. Nu stoppas den här, innan commit, och ett ärende öppnas.
      - name: Kontrollera seeden före commit
        id: seedcheck
        run: |
          node scripts/check-seed.mjs
          node scripts/check-seed-diff.mjs
        env:
          SEED_DIFF: seed-bortfall.txt
          TILLAT_BORTFALL: ${{ inputs.tillat_bortfall }}
      - name: Committa uppdaterad seed-fil
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stations-seed.json scripts/commons-image-cache.json scripts/geocode-cache.json
          if git diff --cached --quiet; then
            echo "Ingen ändring i stationsdatan."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "Uppdatera stationsdata (automatisk synk) [skip ci]"
            # Synken tar ~30 min – hinner någon pusha under tiden avvisas pushen
            # ("fetch first", hände 28 sep 2026). Rebasa på färsk gren och försök igen.
            # Seed-filen är genererad, så vid konflikt vinner den färska synken (-X theirs).
            ok=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push misslyckades (försök $i av 3) – väntar 15 s"
              sleep 15
            done
            [ "$ok" = 1 ] || { echo "::error::Kunde inte pusha seed-filen efter 3 försök"; exit 1; }
          fi
      # Seed-committen har [skip ci] (annars skulle den starta ännu en synk via
      # paths ovan), så deployen startas uttryckligen härifrån i stället.
      # workflow_dispatch via GITHUB_TOKEN skapar en riktig körning (till skillnad
      # från push-händelser som GITHUB_TOKEN gör – de ignoreras av GitHub).
      - name: Starta deploy med den nya seeden
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Registerposter som inte kom med i seeden (geokodningsmiss, fel ort) –
      # tidigare bara en rad i loggen, nu ett ärende som ärenderutinen tar
      # (granskning 12 okt 2026). Ärendet uppdateras; stängs när listan är tom.
      - name: Larma om seedkontrollen stoppade synken (stängs när den går igen)
        if: always() && (steps.seedcheck.outcome == 'failure' || steps.seedcheck.outcome == 'success')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- synk-seedkontroll -->'
            const failed = '${{ steps.seedcheck.outcome }}' === 'failure'
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 })
            const mine = issues.find((i) => (i.body ?? '').startsWith(marker))
            if (!failed) {
              if (mine) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: mine.number, state: 'closed', state_reason: 'completed' })
              return
            }
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const fs = require('fs')
            const esc = (t) => String(t ?? '').replace(/[[\]()<>`*_@#|]/g, ' ')
            const diff = fs.existsSync('seed-bortfall.txt') ? fs.readFileSync('seed-bortfall.txt', 'utf8').split('\n').filter(Boolean) : []
            const body = `${marker}\nDatasynken ${new Date().toISOString().slice(0, 16)} UTC fick en seed som inte klarar kontrollen och publicerade den INTE – sajten visar förra data tills nästa synk lyckas. Antingen för få platser från en källa, trasiga poster, eller att många platser med tömning/vatten/gasol försvann på en gång (se listan).\n\nKörning: ${url}\n\n` +
              (diff.length ? `Försvunna/ändrade platser (${diff.length}):\n` + diff.slice(0, 120).map(esc).join('\n') + '\n\n' : '') +
              `_Ärendet stängs automatiskt när en synk går igenom. Delvis svar från Overpass/Trafikverket: kör "Synka stationsdata" igen om en stund. Avsiktlig ändring (t.ex. ny taggregel): granska listan och kör synken manuellt med rutan "tillat_bortfall"._`
            if (mine) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: mine.number, body })
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Datasynken stoppade en trasig seed', body, labels: ['backlog', 'prio-1'] })
      - name: Rapportera registerposter som föll bort
        if: always() && hashFiles('register-bortfall.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const list = JSON.parse(fs.readFileSync('register-bortfall.json', 'utf8'))
            const marker = '<!-- register-bortfall -->'
            const open = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 })
            const mine = open.find((i) => (i.body ?? '').startsWith(marker))
            if (!list.length) {
              if (mine) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: mine.number, state: 'closed', state_reason: 'completed' })
              return
            }
            const esc = (t) => String(t ?? '').replace(/[[\]()<>`*_@#|]/g, ' ').slice(0, 200)
            const body = `${marker}\nSynken ${new Date().toISOString().slice(0, 16)} UTC: ${list.filter((d) => !d.kept).length} registerposter kom inte med i seeden (syns inte på kartan) och ${list.filter((d) => d.kept).length} visas med förra synkens läge eftersom geokodningen misslyckades.\n\n` +
              list.slice(0, 150).map((d) => `- ${esc(d.name)}${d.id ? ` (${esc(d.id)})` : ''}: ${esc(d.reason)}`).join('\n') +
              `\n\n_Åtgärd: exakta lat/lon från källan, eller rätta query/nearLat/nearLon/maxKm i scripts/curated-places.json._`
            if (mine) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: mine.number, body })
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Registerposter som föll bort ur kartan vid synk', body, labels: ['backlog', 'prio-1'] })
