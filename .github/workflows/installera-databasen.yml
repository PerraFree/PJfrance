name: Installera databasen

# Gör ALLT automatiskt med en enda nyckel (secret SUPABASE_ACCESS_TOKEN):
#  1. Hittar ditt Supabase-projekt och hämtar adress + besöksnyckel
#  2. Sparar dem som repo-variabler (SUPABASE_URL, SUPABASE_ANON_KEY)
#  3. Skapar alla tabeller och regler (supabase/schema.sql, idempotent)
#  4. Startar en ny deploy så appen får kopplingen inbakad
# Säker att köra flera gånger.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  installera:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const token = process.env.SUPABASE_ACCESS_TOKEN
            if (!token) {
              core.setFailed('Secret SUPABASE_ACCESS_TOKEN saknas. Gör steg 1–2 på adminsidan (?admin=1).')
              return
            }
            const mgmt = async (path) => {
              const res = await fetch(`https://api.supabase.com/v1${path}`, {
                headers: { Authorization: `Bearer ${token}` },
              })
              if (!res.ok) throw new Error(`Supabase ${path} svarade ${res.status}: ${await res.text()}`)
              return res.json()
            }
            const mgmtPost = async (path, body) => {
              const res = await fetch(`https://api.supabase.com/v1${path}`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined,
              })
              return res
            }
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

            // 1) Hitta projektet (befintlig variabel/fil om den finns)
            let url = process.env.SUPABASE_URL
            if (!url && fs.existsSync('supabase.env')) {
              const m = fs.readFileSync('supabase.env', 'utf8').match(/VITE_SUPABASE_URL=(.+)/)
              if (m) url = m[1].trim()
            }
            let ref
            if (url) {
              ref = new URL(url).hostname.split('.')[0]
              core.info(`Använder befintlig SUPABASE_URL (${ref}).`)
            } else {
              const projects = await mgmt('/projects')
              if (!projects.length) {
                core.setFailed('Inga Supabase-projekt hittades på kontot som skapade nyckeln.')
                return
              }
              const byName = projects.find((p) => {
                const n = (p.name || '').toLowerCase()
                return n.includes('tomningskarta') || n.includes('tömningskarta')
              })
              const proj = byName ?? (projects.length === 1 ? projects[0] : null)
              if (!proj) {
                core.setFailed(
                  `Flera projekt hittades (${projects.map((p) => p.name).join(', ')}). ` +
                    'Döp rätt projekt till "tomningskartan" i Supabase och kör igen.',
                )
                return
              }
              ref = proj.id
              url = `https://${ref}.supabase.co`
              core.info(`Hittade Supabase-projektet "${proj.name}" (${ref}).`)
            }

            // 1b) Kolla att projektet är igång – väck det om det är pausat och
            // vänta tålmodigt (uppvaknande kan ta 5–10 minuter).
            let info = await mgmt(`/projects/${ref}`)
            core.info(`Projekt: ${info.name} · status: ${info.status}`)
            const restore = async () => {
              const r = await mgmtPost(`/projects/${ref}/restore`)
              if (!r.ok) core.info(`  (restore svarade ${r.status}: ${await r.text()})`)
            }
            if (String(info.status).startsWith('INACTIVE')) {
              core.info('Projektet är pausat – väcker det nu …')
              await restore()
            }
            for (let i = 0; i < 60 && !String(info.status).includes('ACTIVE_HEALTHY'); i++) {
              await sleep(15_000)
              info = await mgmt(`/projects/${ref}`)
              core.info(`  … väntar (${Math.round(((i + 1) * 15) / 60)} min): ${info.status}`)
              // Om restore-anropet inte tog: prova igen en gång efter en stund
              if (i === 8 && String(info.status).startsWith('INACTIVE')) {
                core.info('Provar väcka projektet igen …')
                await restore()
              }
            }
            if (!String(info.status).includes('ACTIVE_HEALTHY')) {
              core.setFailed(
                `Projektet "${info.name}" blev inte igång i tid (status: ${info.status}). ` +
                  'Vänta 5 minuter och kör denna workflow igen – den fortsätter där den slutade.',
              )
              return
            }
            core.info('✅ Projektet är igång.')

            // 2) Hämta besöksnyckeln (gamla "anon" ELLER nya "publishable").
            // Finns kopplingen redan i repot (supabase.env med URL + nyckel)
            // hoppas steget över: en avgränsad token får ofta inte läsa
            // API-nycklar (403, okt 2026), och då behövs det inte heller –
            // jobbet används då bara för att köra supabase/schema.sql.
            let befintlig = null
            if (fs.existsSync('supabase.env')) {
              const env = fs.readFileSync('supabase.env', 'utf8')
              const mu = env.match(/VITE_SUPABASE_URL=(.+)/)
              const mk = env.match(/VITE_SUPABASE_ANON_KEY=(.+)/)
              if (mu && mk && mu[1].trim() === url && mk[1].trim()) befintlig = mk[1].trim()
            }
            const BRANCH = context.payload.repository?.default_branch ?? 'claude/gravatten-latrin-app-sverige-aed0qg'
            let kopplingAndrad = false
            if (befintlig) {
              core.info('Kopplingen finns redan i repot (supabase.env) – hoppar över nyckelhämtningen.')
            } else {
            const pickKey = (keys) =>
              keys.find((k) => k.name === 'anon' && k.api_key)?.api_key ??
              keys.find((k) => k.type === 'publishable' && k.api_key)?.api_key ??
              keys.find((k) => (k.api_key || '').startsWith('sb_publishable_'))?.api_key
            let keys = await mgmt(`/projects/${ref}/api-keys?reveal=true`)
            let anon = pickKey(keys)
            if (!anon) {
              // Inga nycklar? Skapa en publishable-nyckel automatiskt.
              core.info('Ingen besöksnyckel hittades – skapar en …')
              const created = await mgmtPost(`/projects/${ref}/api-keys?reveal=true`, {
                type: 'publishable',
                name: 'tomningskartan',
              })
              if (created.ok) {
                const k = await created.json()
                anon = k.api_key
              } else {
                core.info(`Kunde inte skapa nyckel (${created.status}): ${await created.text()}`)
                keys = await mgmt(`/projects/${ref}/api-keys?reveal=true`)
                anon = pickKey(keys)
              }
            }
            if (!anon) {
              core.setFailed(
                'Hittade ingen användbar besöksnyckel. Nycklar i projektet: ' +
                  JSON.stringify(keys.map((k) => ({ name: k.name, type: k.type }))),
              )
              return
            }
            core.info(`Besöksnyckel klar (${anon.startsWith('sb_publishable_') ? 'nya formatet' : 'anon'}).`)
            // Spara kopplingen som fil i repot (besöksnyckeln är publik per
            // design – den ligger ändå öppet i appens byggda kod).
            const envContent = `VITE_SUPABASE_URL=${url}\nVITE_SUPABASE_ANON_KEY=${anon}\n`
            let existingSha
            try {
              const cur = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'supabase.env',
                ref: BRANCH,
              })
              existingSha = cur.data.sha
            } catch {
              /* filen finns inte ännu */
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'supabase.env',
              message: 'Koppla Supabase automatiskt (supabase.env)',
              content: Buffer.from(envContent).toString('base64'),
              branch: BRANCH,
              ...(existingSha ? { sha: existingSha } : {}),
            })
            core.info('✅ Kopplingen sparad i repot (supabase.env).')
            kopplingAndrad = true
            }

            // 3) Installera databasen (idempotent)
            const sql = fs.readFileSync('supabase/schema.sql', 'utf8')
            const res = await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: sql }),
            })
            if (!res.ok) {
              core.setFailed(`Databasinstallationen misslyckades (${res.status}): ${await res.text()}`)
              return
            }
            core.info('✅ Databasen är installerad (alla tabeller och regler finns).')

            // 4) Bygg om appen så kopplingen bakas in (bara om den ändrades)
            if (!kopplingAndrad) {
              core.info('Kopplingen oförändrad – ingen ny deploy behövs.')
              return
            }
            await github.request(
              'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy.yml',
                ref: BRANCH,
              },
            )
            core.info('🚀 Ny deploy startad – om några minuter är allt grönt på adminsidan.')
