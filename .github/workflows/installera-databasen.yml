name: Installera databasen

# Gör ALLT automatiskt med en enda nyckel (secret SUPABASE_ACCESS_TOKEN):
#  1. Hittar ditt Supabase-projekt och hämtar adress + besöksnyckel
#  2. Sparar dem som repo-variabler (SUPABASE_URL, SUPABASE_ANON_KEY)
#  3. Skapar alla tabeller och regler (supabase/schema.sql, idempotent)
#  4. Startar en ny deploy så appen får kopplingen inbakad
# Säker att köra flera gånger.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  installera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          script: |
            const fs = require('fs')
            const token = process.env.SUPABASE_ACCESS_TOKEN
            if (!token) {
              core.setFailed('Secret SUPABASE_ACCESS_TOKEN saknas. Gör steg 1–2 på adminsidan (?admin=1).')
              return
            }
            const mgmt = async (path) => {
              const res = await fetch(`https://api.supabase.com/v1${path}`, {
                headers: { Authorization: `Bearer ${token}` },
              })
              if (!res.ok) throw new Error(`Supabase ${path} svarade ${res.status}: ${await res.text()}`)
              return res.json()
            }
            const mgmtPost = async (path, body) => {
              const res = await fetch(`https://api.supabase.com/v1${path}`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined,
              })
              return res
            }
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

            // 1) Hitta projektet (använd befintlig variabel om den finns)
            let url = process.env.SUPABASE_URL
            let ref
            if (url) {
              ref = new URL(url).hostname.split('.')[0]
              core.info(`Använder befintlig SUPABASE_URL (${ref}).`)
            } else {
              const projects = await mgmt('/projects')
              if (!projects.length) {
                core.setFailed('Inga Supabase-projekt hittades på kontot som skapade nyckeln.')
                return
              }
              const byName = projects.find((p) => {
                const n = (p.name || '').toLowerCase()
                return n.includes('tomningskarta') || n.includes('tömningskarta')
              })
              const proj = byName ?? (projects.length === 1 ? projects[0] : null)
              if (!proj) {
                core.setFailed(
                  `Flera projekt hittades (${projects.map((p) => p.name).join(', ')}). ` +
                    'Döp rätt projekt till "tomningskartan" i Supabase och kör igen.',
                )
                return
              }
              ref = proj.id
              url = `https://${ref}.supabase.co`
              core.info(`Hittade Supabase-projektet "${proj.name}" (${ref}).`)
            }

            // 1b) Kolla att projektet är igång – väck det om det är pausat
            let info = await mgmt(`/projects/${ref}`)
            core.info(`Projekt: ${info.name} · status: ${info.status}`)
            if (String(info.status).startsWith('INACTIVE')) {
              core.info('Projektet är pausat – väcker det nu (tar ett par minuter) …')
              await mgmtPost(`/projects/${ref}/restore`)
              for (let i = 0; i < 24 && !String(info.status).includes('ACTIVE_HEALTHY'); i++) {
                await sleep(10_000)
                info = await mgmt(`/projects/${ref}`)
                core.info(`  … status: ${info.status}`)
              }
            } else if (info.status === 'COMING_UP') {
              for (let i = 0; i < 18 && info.status === 'COMING_UP'; i++) {
                await sleep(10_000)
                info = await mgmt(`/projects/${ref}`)
                core.info(`  … status: ${info.status}`)
              }
            }
            if (!String(info.status).includes('ACTIVE_HEALTHY')) {
              core.setFailed(
                `Projektet "${info.name}" är inte igång (status: ${info.status}). ` +
                  'Öppna https://supabase.com/dashboard → klicka på projektet → "Restore project" om det erbjuds, vänta tills det är igång och kör sedan denna workflow igen.',
              )
              return
            }

            // 2) Hämta besöksnyckeln (gamla "anon" ELLER nya "publishable")
            const pickKey = (keys) =>
              keys.find((k) => k.name === 'anon' && k.api_key)?.api_key ??
              keys.find((k) => k.type === 'publishable' && k.api_key)?.api_key ??
              keys.find((k) => (k.api_key || '').startsWith('sb_publishable_'))?.api_key
            let keys = await mgmt(`/projects/${ref}/api-keys?reveal=true`)
            let anon = pickKey(keys)
            if (!anon) {
              // Inga nycklar? Skapa en publishable-nyckel automatiskt.
              core.info('Ingen besöksnyckel hittades – skapar en …')
              const created = await mgmtPost(`/projects/${ref}/api-keys?reveal=true`, {
                type: 'publishable',
                name: 'tomningskartan',
              })
              if (created.ok) {
                const k = await created.json()
                anon = k.api_key
              } else {
                core.info(`Kunde inte skapa nyckel (${created.status}): ${await created.text()}`)
                keys = await mgmt(`/projects/${ref}/api-keys?reveal=true`)
                anon = pickKey(keys)
              }
            }
            if (!anon) {
              core.setFailed(
                'Hittade ingen användbar besöksnyckel. Nycklar i projektet: ' +
                  JSON.stringify(keys.map((k) => ({ name: k.name, type: k.type }))),
              )
              return
            }
            core.info(`Besöksnyckel klar (${anon.startsWith('sb_publishable_') ? 'nya formatet' : 'anon'}).`)
            const setVar = async (name, value) => {
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/variables', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  value,
                })
              } catch {
                await github.request('PATCH /repos/{owner}/{repo}/actions/variables/{name}', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  value,
                })
              }
            }
            await setVar('SUPABASE_URL', url)
            await setVar('SUPABASE_ANON_KEY', anon)
            core.info('✅ Repo-variablerna SUPABASE_URL och SUPABASE_ANON_KEY är satta.')

            // 3) Installera databasen (idempotent)
            const sql = fs.readFileSync('supabase/schema.sql', 'utf8')
            const res = await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: sql }),
            })
            if (!res.ok) {
              core.setFailed(`Databasinstallationen misslyckades (${res.status}): ${await res.text()}`)
              return
            }
            core.info('✅ Databasen är installerad (alla tabeller och regler finns).')

            // 4) Bygg om appen så kopplingen bakas in
            await github.request(
              'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy.yml',
                ref: 'claude/gravatten-latrin-app-sverige-aed0qg',
              },
            )
            core.info('🚀 Ny deploy startad – om några minuter är allt grönt på adminsidan.')
