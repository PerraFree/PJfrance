name: Dependabot – automatisk merge

# Per vill slippa klicka igenom Dependabots förslag varje måndag (19 okt 2026).
# Den här workflowen gör samma kontroller som deployen (vakterna + bygget) på
# Dependabots förslag och mergar själv om allt går igenom. Bara patch/minor –
# en major-uppdatering (t.ex. Vite 7, ny major av en action) lämnas med en
# kommentar, den kräver att en session tittar på den. Förslag som rör andra
# filer än package*.json mergas aldrig automatiskt. Actions-uppdateringar
# (workflowfiler) kan GitHubs token inte merga – de lämnas med en kommentar åt
# en session (granskning 21 okt 2026).
# Dependabot väntar 7 dagar på nya versioner (cooldown i dependabot.yml), så
# ett kapat paket hinner oftast dras tillbaka innan det når hit.
#
# Säkerhet: kontrolljobbet (som kör beroendenas kod i bygget) har bara läsrätt.
# Skrivrätten finns bara i merge-jobbet, som inte checkar ut någon kod. Körs
# bara för PR:er som Dependabot själv öppnat i det här repot.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kontroll:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-type: ${{ steps.meta.outputs.update-type }}
      filer-ok: ${{ steps.filer.outputs.ok }}
      ekosystem: ${{ steps.meta.outputs.package-ecosystem }}
      beroenden: ${{ steps.meta.outputs.dependency-names }}
    steps:
      - name: Läs vad Dependabot uppdaterar (patch/minor/major)
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bara package*.json och workflows får ändras
        id: filer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          filer=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "$filer"
          if echo "$filer" | grep -qvE '^(package\.json|package-lock\.json|\.github/workflows/[A-Za-z0-9._-]+\.ya?ml)$'; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Förslaget rör andra filer – ingen automatisk merge"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-mirrors.mjs
      # Mot seeden i samma utcheckning, inte den publicerade: förslaget rör bara
      # package*.json/workflows, och en PR-gren som ligger efter jämfördes annars
      # mot en nyare publicerad seed och falsklarmade (granskning 28 okt 2026).
      - name: Kvalitetskontroll av registret
        run: node scripts/check-register.mjs
      - run: node scripts/check-csp.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/check-seed.mjs
      - run: node scripts/build-seo-pages.mjs
      - name: Bygg appen
        run: npm run build
        env:
          BASE_PATH: /
      - name: Kontrollera bygget
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          grep -q 'Content-Security-Policy' dist/index.html

  merge:
    needs: kontroll
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      TYP: ${{ needs.kontroll.outputs.update-type }}
      FILER_OK: ${{ needs.kontroll.outputs.filer-ok }}
      BAS: ${{ github.event.pull_request.base.ref }}
      ECO: ${{ needs.kontroll.outputs.ekosystem }}
      DEPS: ${{ needs.kontroll.outputs.beroenden }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Merga (patch/minor) eller lämna kvar (major/okänt)
        run: |
          # Lämnar PR:en kvar med EN kommentar (inte en ny vid varje rebase).
          lamna() {
            echo "$1"
            if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body' | grep -q 'automerge-lamnad'; then
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "<!-- automerge-lamnad -->
          Automatisk merge hoppades över: $1 Kontrollerna gick igenom; en Claude-session tar hand om den."
            fi
            exit 0
          }
          [ "$FILER_OK" = "true" ] || lamna "förslaget rör andra filer än package*.json."
          [ -n "$ECO" ] && [ -n "$DEPS" ] || lamna "okänt ekosystem eller beroende."
          # GitHubs egen token får inte ändra filer under .github/workflows/, så
          # actions-uppdateringar kan inte mergas härifrån (granskning 21 okt 2026).
          [ "$ECO" != "github_actions" ] || lamna "actions-uppdateringar ändrar workflowfiler, som GitHubs token inte får merga."
          case "$TYP" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) lamna "uppdateringstypen är \`${TYP:-okänd}\` (bara patch/minor mergas automatiskt)." ;;
          esac
          # Bara exakt den commit som kontrollerades mergas.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$SHA" \
            || gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch --match-head-commit "$SHA"
          # En merge med GITHUB_TOKEN startar inga push-workflows – starta deployen
          # och Android-bygget (deploy-vakt.yml fångar deployen annars).
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$BAS" || true
          gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref "$BAS" || true
