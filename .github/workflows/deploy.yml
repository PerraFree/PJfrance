name: Deploy till GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gravatten-latrin-app-sverige-aed0qg
  workflow_dispatch:
  schedule:
    # Veckovis datasynk + omdeploy (körs bara när workflowen finns på default-branchen)
    - cron: '0 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synka stationsdata (OSM + Trafikverket)
        run: node scripts/sync-stations.mjs
        continue-on-error: true
        env:
          TRV_API_KEY: ${{ secrets.TRV_API_KEY }}
      - run: npm run build
        env:
          BASE_PATH: /PJfrance/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
