name: Deploy till GitHub Pages

# Bygger appen från den COMMITTADE seed-filen (public/data/stations-seed.json)
# och publicerar – tar ett par minuter. Själva datasynken (OSM/Trafikverket/
# geokodning, ~30 min) sköts av sync-data.yml, som committar seeden och sedan
# startar den här workflowen (issue #15). Vill man undantagsvis synka i samma
# körning: kör workflowen manuellt med rutan "synk" ibockad.
on:
  push:
    branches:
      - main
      - claude/gravatten-latrin-app-sverige-aed0qg
  workflow_dispatch:
    inputs:
      synk:
        description: 'Synka stationsdata (OSM + Trafikverket) innan bygget (~30 min)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: inga installationsskript från beroenden i ett jobb med
      # skrivrätt till repot (säkerhetsgranskning 12 okt 2026).
      - run: npm ci --ignore-scripts
      - name: Kontrollera att OSM-listorna är identiska i synk och app (stoppar vid avvikelse)
        run: node scripts/check-mirrors.mjs
      - name: Kvalitetskontroll av registret (tjänstekoder, koordinater, dubbletter inom 100 m)
        run: node scripts/check-register.mjs
      - name: Säkerhetskontroll av produktionsberoenden (stoppar vid high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Synka stationsdata (OSM + Trafikverket) – bara vid manuell körning med "synk"
        if: github.event_name == 'workflow_dispatch' && inputs.synk
        run: node scripts/sync-stations.mjs
        continue-on-error: true
        env:
          TRV_API_KEY: ${{ secrets.TRV_API_KEY }}
      - name: Bygg SEO-sidor (kommunsidor + sitemap) från seed-datan
        run: node scripts/build-seo-pages.mjs
        continue-on-error: true
      - name: Läs Supabase-koppling (supabase.env eller repo-variabler)
        run: |
          if [ -f supabase.env ]; then
            # Släpp bara igenom VITE_-rader och rensa bort CR/blanksteg i slutet
            grep -E '^VITE_[A-Z_]+=' supabase.env | sed 's/[[:space:]\r]*$//' >> "$GITHUB_ENV"
            echo "Använder supabase.env"
          elif [ -n "$FALLBACK_URL" ]; then
            echo "VITE_SUPABASE_URL=$FALLBACK_URL" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_ANON_KEY=$FALLBACK_KEY" >> "$GITHUB_ENV"
            echo "Använder repo-variabler"
          else
            echo "Ingen Supabase-koppling – community-funktioner döljs"
          fi
        env:
          FALLBACK_URL: ${{ vars.SUPABASE_URL }}
          FALLBACK_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          BASE_PATH: /
      - name: Publicera till gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: tomningskartan.se
