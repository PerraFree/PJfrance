name: Deploy till GitHub Pages

# Bygger appen från den COMMITTADE seed-filen (public/data/stations-seed.json)
# och publicerar – tar ett par minuter. Själva datasynken (OSM/Trafikverket/
# geokodning, ~30 min) sköts av sync-data.yml, som committar seeden och sedan
# startar den här workflowen (issue #15). Ny data utan att vänta på måndagen:
# kör "Synka stationsdata till repot" manuellt.
on:
  push:
    branches:
      - claude/gravatten-latrin-app-sverige-aed0qg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ingen skrivtoken i .git/config som byggkoden kan läsa – publiceringen
          # får sin token direkt via github_token (granskning 12 okt 2026).
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: inga installationsskript från beroenden i ett jobb med
      # skrivrätt till repot (säkerhetsgranskning 12 okt 2026).
      - run: npm ci --ignore-scripts
      - name: Kontrollera att OSM-listorna är identiska i synk och app (stoppar vid avvikelse)
        run: node scripts/check-mirrors.mjs
      - name: Kvalitetskontroll av registret (tjänstekoder, koordinater, dubbletter inom 100 m)
        run: |
          # Förlustvakten jämför mot den PUBLICERADE seeden (gh-pages) – den
          # committade kan redan innehålla förlusten efter en synk (granskning 14 okt 2026).
          if git fetch -q --depth=1 origin gh-pages && git show FETCH_HEAD:data/stations-seed.json > "$RUNNER_TEMP/pub-seed.json"; then
            SEED_PATH="$RUNNER_TEMP/pub-seed.json" node scripts/check-register.mjs
          else
            echo "::warning::Kunde inte läsa den publicerade seeden – jämför med den committade"
            node scripts/check-register.mjs
          fi
      - name: Kontrollera att CSP:n täcker alla externa värdar i appen
        run: node scripts/check-csp.mjs
      - name: Säkerhetskontroll av produktionsberoenden (stoppar vid high/critical)
        run: npm audit --omit=dev --audit-level=high
      # Synk-rutan borttagen (granskning 14 okt 2026): synken tar 13–36 min och
      # hann inte inom jobbets 20 min, och en manuell synk här committades aldrig.
      # Kör "Synka stationsdata till repot" (sync-data.yml) i stället.
      - name: Kontroll av seeden (golv per källa, koordinater, tjänster, dubbla id)
        env:
          # En push som ändrar registret men inte seeden: seeden ligger efter tills
          # sync-data.yml (startas av samma push) committat den nya och deployat –
          # registergolvet blir då en varning i stället för ett falsklarm (26 okt 2026).
          REGISTER_AHEAD: ${{ github.event_name == 'push' && contains(join(github.event.head_commit.modified, ','), 'scripts/curated-places.json') && !contains(join(github.event.head_commit.modified, ','), 'public/data/stations-seed.json') }}
        run: node scripts/check-seed.mjs
      - name: Bygg SEO-sidor (kommunsidor + sitemap) från seed-datan
        run: node scripts/build-seo-pages.mjs
      - name: Läs Supabase-koppling (supabase.env eller repo-variabler)
        run: |
          if [ -f supabase.env ]; then
            # Släpp bara igenom VITE_-rader och rensa bort CR/blanksteg i slutet
            grep -E '^VITE_[A-Z_]+=' supabase.env | sed 's/[[:space:]\r]*$//' >> "$GITHUB_ENV"
            echo "Använder supabase.env"
          elif [ -n "$FALLBACK_URL" ]; then
            echo "VITE_SUPABASE_URL=$FALLBACK_URL" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_ANON_KEY=$FALLBACK_KEY" >> "$GITHUB_ENV"
            echo "Använder repo-variabler"
          else
            echo "Ingen Supabase-koppling – community-funktioner döljs"
          fi
        env:
          FALLBACK_URL: ${{ vars.SUPABASE_URL }}
          FALLBACK_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          BASE_PATH: /
      - name: Kontrollera bygget (sitemap, kommunsidor, CSP finns)
        run: |
          test -s dist/sitemap.xml
          test "$(ls dist/kommun | wc -l)" -ge 200
          # SEO (12 okt 2026): platssidor, tjänstesidor och FAQ ska finnas
          test "$(ls dist/plats | wc -l)" -ge 1000
          test -s dist/tjanst/latrintomning/index.html
          test -s dist/fragor/index.html
          test -s dist/seo.css
          grep -q 'Content-Security-Policy' dist/index.html
          # CSP i meta gäller bara det som kommer EFTER taggen – den måste ligga
          # före första skriptet, och charset inom första 1024 byte.
          node -e "const h=require('fs').readFileSync('dist/index.html','utf8');const c=h.indexOf('Content-Security-Policy'),s=h.indexOf('<script type=\"module\"'),m=h.indexOf('<meta charset');if(!(c>0&&c<s&&m>=0&&m<1024)){console.error('CSP/charset i fel ordning',{c,s,m});process.exit(1)}"
      - name: Publicera till gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: tomningskartan.se
