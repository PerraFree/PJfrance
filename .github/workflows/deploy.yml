name: Deploy till GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gravatten-latrin-app-sverige-aed0qg
  workflow_dispatch:
  schedule:
    # Veckovis datasynk + omdeploy (körs bara när workflowen finns på default-branchen)
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synka stationsdata (OSM + Trafikverket)
        run: node scripts/sync-stations.mjs
        continue-on-error: true
        env:
          TRV_API_KEY: ${{ secrets.TRV_API_KEY }}
      - name: Läs Supabase-koppling (supabase.env eller repo-variabler)
        run: |
          if [ -f supabase.env ]; then
            cat supabase.env >> "$GITHUB_ENV"
            echo "Använder supabase.env"
          elif [ -n "$FALLBACK_URL" ]; then
            echo "VITE_SUPABASE_URL=$FALLBACK_URL" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_ANON_KEY=$FALLBACK_KEY" >> "$GITHUB_ENV"
            echo "Använder repo-variabler"
          else
            echo "Ingen Supabase-koppling – community-funktioner döljs"
          fi
        env:
          FALLBACK_URL: ${{ vars.SUPABASE_URL }}
          FALLBACK_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: npm run build
        env:
          BASE_PATH: /PJfrance/
      - name: Publicera till gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
