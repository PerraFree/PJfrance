# Håller de SHA-låsta GitHub Actions-versionerna uppdaterade via PR:er
# (issue #14, okt 2026). Dependabot uppdaterar både SHA:n och versions-
# kommentaren efter @. npm: EN samlad PR i veckan med bara minor/patch
# (major, t.ex. Vite 7, väljs bort medvetet – se CLAUDE.md). Granskning 12 okt 2026.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    # Ingen "labels:"-rad: etiketten måste finnas i repot i förväg, annars
    # lägger Dependabot en felkommentar i varje PR (hände 11 okt 2026).
    # Nya versioner väntar 7 dagar innan förslaget öppnas – ger tid för att
    # ett kapat paket upptäcks och dras tillbaka (granskning 21 okt 2026).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "actions"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 1
    groups:
      alla-npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "npm"
