# Håller de SHA-låsta GitHub Actions-versionerna uppdaterade via PR:er
# (issue #14, okt 2026). Dependabot uppdaterar både SHA:n och versions-
# kommentaren efter @. npm-beroenden sköts manuellt (npm audit, se CLAUDE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    # Ingen "labels:"-rad: etiketten måste finnas i repot i förväg, annars
    # lägger Dependabot en felkommentar i varje PR (hände 11 okt 2026).
    commit-message:
      prefix: "actions"
